name: SCAMERA
options:
  bundleIdPrefix: com.scamera
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  developmentLanguage: en
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1"
    CURRENT_PROJECT_VERSION: "1"
    SCAM_GIT_SHA: local
    CLANG_CXX_LANGUAGE_STANDARD: c++17
    CLANG_CXX_LIBRARY: libc++
    GCC_C_LANGUAGE_STANDARD: gnu11
    ENABLE_BITCODE: NO
targets:
  SCAMERA:
    type: application
    platform: iOS
    sources:
      - path: App
      - path: Capture
      - path: Bridge
      - path: Engine
      - path: ScamGL
      - path: Gallery
      - path: Support
      - path: Resources
      - path: LICENSE-AVCam.txt
        buildPhase: resources
      # the merge tuning of the replays (tools/replay_tuning.txt: the Android app's hybrid_tuning.txt of a shot)
      - path: ../tools/replay_tuning.txt
        buildPhase: resources
      # the Android app's shaders: the post pipeline (Engine/post) loads them as the app's assets
      - path: ../app/src/main/assets/shaders
        type: folder
        buildPhase: resources
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: SCAMERA
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        SCAMGitSHA: $(SCAM_GIT_SHA)
        CFBundleDevelopmentRegion: en
        CFBundleLocalizations: [en, ru]
        LSRequiresIPhoneOS: true
        UIRequiredDeviceCapabilities: [arm64]
        UIRequiresFullScreen: true
        UIStatusBarHidden: true
        UIViewControllerBasedStatusBarAppearance: true
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UILaunchScreen:
          UIColorName: ""
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        NSCameraUsageDescription: SCAMERA uses the camera to take photos.
        NSPhotoLibraryAddUsageDescription: SCAMERA saves the photos you take to your library.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.scamera.ios
        PRODUCT_NAME: SCAMERA
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_OBJC_BRIDGING_HEADER: Bridge/SCAMERA-Bridging-Header.h
        HEADER_SEARCH_PATHS: ["$(inherited)", "$(SRCROOT)/Engine", "$(SRCROOT)/ScamGL/include", "$(SRCROOT)/ScamGL",
                              "$(SRCROOT)/../app/src/main/cpp", "$(SCAM_DEPS)/$(SCAM_DEPS_PLATFORM)/include",
                              "$(SCAM_DEPS)/$(SCAM_DEPS_PLATFORM)/include/spirv_cross"]
        # glslang / SPIRV-Cross static libraries (tools/build_shader_deps.sh; CI passes SCAM_DEPS)
        SCAM_DEPS: $(SRCROOT)/build/deps
        "SCAM_DEPS_PLATFORM[sdk=iphoneos*]": ios
        "SCAM_DEPS_PLATFORM[sdk=iphonesimulator*]": iossim
        LIBRARY_SEARCH_PATHS: ["$(inherited)", "$(SCAM_DEPS)/$(SCAM_DEPS_PLATFORM)/lib"]
        OTHER_LDFLAGS: ["$(inherited)", "-lglslang", "-lMachineIndependent", "-lGenericCodeGen", "-lOSDependent", "-lSPIRV",
                        "-lglslang-default-resource-limits", "-lspirv-cross-msl", "-lspirv-cross-glsl", "-lspirv-cross-core"]
        CLANG_ENABLE_OBJC_ARC: YES
        MTL_HEADER_SEARCH_PATHS: ["$(inherited)", "$(SRCROOT)/Engine"]
        MTL_FAST_MATH: NO
        GCC_PREPROCESSOR_DEFINITIONS: ["$(inherited)", "SCAM_IOS=1"]
        OTHER_CPLUSPLUSFLAGS: ["$(inherited)", "-ffp-contract=off"]
        ASSETCATALOG_COMPILER_APPICON_NAME: ""
        CODE_SIGN_STYLE: Automatic
        INFOPLIST_KEY_CFBundleDisplayName: SCAMERA
  SCAMERATests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
    dependencies:
      - target: SCAMERA
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.scamera.ios.tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/SCAMERA.app/SCAMERA
        BUNDLE_LOADER: $(TEST_HOST)
schemes:
  SCAMERA:
    build:
      targets:
        SCAMERA: all
        SCAMERATests: [test]
    test:
      targets: [SCAMERATests]
      gatherCoverageData: false
    archive:
      config: Release
