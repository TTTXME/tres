# SCAMERA build settings (the IDE's own Gradle settings take precedence over these).

# The Gradle daemon's heap (the unit tests fork their own JVMs, app/build.gradle testOptions); P662: R8 runs in the daemon.
org.gradle.jvmargs=-Xmx3g

# AndroidX, with Jetifier for the dependencies still on the support library; Robolectric's JVM-only crypto has no support
# references to rewrite.
android.useAndroidX=true
android.enableJetifier=true
android.jetifier.ignorelist=bcprov-jdk18on-.*\.jar

# One R class per module that includes its libraries' ids, and final ids: the code reads library resources through the app's R
# and switches on view ids.
android.nonTransitiveRClass=false
android.nonFinalResIds=false
