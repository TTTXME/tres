<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Настройки SCAMERA</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Roboto+Flex:opsz,wght@8..144,400;8..144,500;8..144,600;8..144,700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#1C1C1E}
@keyframes camFlash{0%,100%{background:#2C2C2E}25%,60%{background:#48484A}}
a{color:inherit;text-decoration:none}a:hover{color:inherit}
*{-webkit-tap-highlight-color:transparent}
button:focus{outline:none}
button:focus-visible,a:focus-visible,input:focus-visible{outline:2px solid #FFD60A;outline-offset:2px}
.rowbtn:active{background:rgba(255,255,255,.08)}
.mi:active{background:rgba(255,255,255,.12)}
@keyframes iosKnobA{0%{transform:scale(1)}30%{transform:scale(1.2,.84)}60%{transform:scale(.94,1.07)}100%{transform:scale(1)}}
@keyframes iosKnobB{0%{transform:scale(1)}30%{transform:scale(1.2,.84)}60%{transform:scale(.94,1.07)}100%{transform:scale(1)}}
@keyframes iosPopA{0%{transform:scale(1)}35%{transform:scale(1.22)}100%{transform:scale(1)}}
@keyframes iosPopB{0%{transform:scale(1)}35%{transform:scale(1.22)}100%{transform:scale(1)}}
@keyframes iosMenuIn{0%{transform:scale(.25);opacity:0;filter:blur(6px)}60%{opacity:1;filter:blur(0)}100%{transform:scale(1);opacity:1}}
@keyframes iosMenuOut{to{transform:scale(.6);opacity:0;filter:blur(4px)}}
@keyframes iosFade{from{opacity:0}to{opacity:1}}
@keyframes iosAlertIn{0%{transform:scale(1.15);opacity:0}100%{transform:scale(1);opacity:1}}
@keyframes iosHud{0%{transform:translate(-50%,-30px) scale(.8);opacity:0}100%{transform:translate(-50%,0) scale(1);opacity:1}}
@keyframes iosFlash{0%,100%{background:#1C1C1E}25%,60%{background:#3A3A3C}}

</style>
</helmet>
<div style="position: relative; width: 390px; min-height: 844px; box-sizing: border-box; padding: 0 16px 60px; font-family: 'Roboto Flex', -apple-system, system-ui, sans-serif; background: #1C1C1E; color: #FFFFFF; -webkit-font-smoothing: antialiased">

  <div style="display: flex; align-items: center; justify-content: space-between; gap: 8px; padding-top: 16px; height: 44px">
    <sc-if value="{{atRoot}}" hint-placeholder-val="{{ true }}">
      <a href="Viewfinder.dc.html" aria-label="Назад к камере" style="{{roundBtn}}"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg></a>
    </sc-if>
    <sc-if value="{{notRoot}}" hint-placeholder-val="{{ false }}">
      <button onClick="{{back}}" aria-label="Назад" style="{{roundBtn}}"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg></button>
      <span style="flex: 1; min-width: 0; font-size: 13px; color: rgba(255,255,255,.55); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; text-align: center">{{crumb}}</span>
      <button onClick="{{resetPage}}" aria-label="Сбросить настройки этой страницы" style="{{roundBtn}}"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 12a8 8 0 1 0 2.3-5.6 M4 4v4.5h4.5"/></svg></button>
    </sc-if>
  </div>

  <h1 style="{{titleStyle}}">{{title}}</h1>
  <sc-if value="{{hasPageSummary}}" hint-placeholder-val="{{ false }}">
    <p style="margin: -4px 4px 14px; font-size: 14px; line-height: 19px; color: rgba(255,255,255,.65)">{{pageSummary}}</p>
  </sc-if>

  <sc-if value="{{atRoot}}" hint-placeholder-val="{{ true }}">
    <label style="display: flex; align-items: center; gap: 8px; height: 44px; padding: 0 12px; border-radius: 22px; background: #2C2C2E; color: rgba(255,255,255,.55); margin-bottom: 10px">
      <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M10.5 4a6.5 6.5 0 1 0 0 13a6.5 6.5 0 1 0 0-13z M15.5 15.5L20 20"/></svg>
      <input aria-label="Поиск в настройках" placeholder="Поиск" value="{{q}}" onInput="{{setQ}}" style="flex: 1; min-width: 0; border: 0; outline: none; background: transparent; font: inherit; font-size: 17px; color: #FFFFFF">
      <sc-if value="{{hasQ}}" hint-placeholder-val="{{ false }}">
        <button onClick="{{clearQ}}" aria-label="Очистить" style="width: 22px; height: 22px; border: 0; padding: 0; border-radius: 11px; background: rgba(255,255,255,.45); color: #2C2C2E; font-size: 14px; line-height: 22px; font-weight: 700; cursor: pointer">×</button>
      </sc-if>
    </label>
  </sc-if>

  <sc-for list="{{blocks}}" as="b" hint-placeholder-count="10">
    <sc-if value="{{b.isHeader}}" hint-placeholder-val="{{ false }}">
      <div style="{{b.hStyle}}">{{b.title}}</div>
    </sc-if>
    <sc-if value="{{b.isNote}}" hint-placeholder-val="{{ false }}">
      <div style="padding: 8px 16px 4px; font-size: 13px; line-height: 18px; color: rgba(255,255,255,.55)">{{b.title}}</div>
    </sc-if>
    <sc-if value="{{b.isRow}}" hint-placeholder-val="{{ true }}">
      <div style="{{b.rowStyle}}">
        <sc-if value="{{b.sep}}" hint-placeholder-val="{{ false }}">
          <div style="{{b.sepStyle}}"></div>
        </sc-if>
        <button class="rowbtn" onClick="{{b.tap}}" aria-label="{{b.aria}}" style="display: flex; align-items: center; gap: 12px; width: 100%; min-height: 52px; padding: 9px 16px; box-sizing: border-box; border: 0; background: transparent; color: inherit; font: inherit; text-align: left; cursor: pointer; transition: background .2s">
          <sc-if value="{{b.hasIcon}}" hint-placeholder-val="{{ true }}">
            <span style="{{b.tile}}"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{b.d}}"/></svg></span>
          </sc-if>
          <span style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px">
            <span style="font-size: 16px; line-height: 21px; font-weight: 600; overflow-wrap: anywhere">{{b.title}}</span>
            <sc-if value="{{b.hasSub}}" hint-placeholder-val="{{ false }}">
              <span style="font-size: 13px; line-height: 17px; color: rgba(255,255,255,.6); display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden">{{b.sub}}</span>
            </sc-if>
          </span>
          <sc-if value="{{b.hasValue}}" hint-placeholder-val="{{ false }}">
            <span style="{{b.valueStyle}}">{{b.value}}</span>
          </sc-if>
          <sc-if value="{{b.hasPill}}" hint-placeholder-val="{{ false }}">
            <span style="flex: none; height: 30px; padding: 0 12px; border-radius: 15px; background: #4A3D00; display: flex; align-items: center"><span style="{{b.valueStyle}}">{{b.value}}</span></span>
          </sc-if>
          <sc-if value="{{b.isSwitch}}" hint-placeholder-val="{{ false }}">
            <span role="switch" aria-checked="{{b.checked}}" style="{{b.sw.track}}"><span style="{{b.sw.knob}}"></span></span>
          </sc-if>
          <sc-if value="{{b.hasUpDown}}" hint-placeholder-val="{{ false }}">
            <svg width="13" height="17" viewBox="0 0 13 17" fill="none" stroke="rgba(255,255,255,.55)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none"><path d="M2.5 6l4-4 4 4 M2.5 11l4 4 4-4"/></svg>
          </sc-if>
          <sc-if value="{{b.hasChevron}}" hint-placeholder-val="{{ true }}">
            <svg width="9" height="15" viewBox="0 0 9 15" fill="none" stroke="rgba(255,255,255,.35)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none"><path d="M1.5 1.5l6 6-6 6"/></svg>
          </sc-if>
        </button>
        <sc-if value="{{b.isSlider}}" hint-placeholder-val="{{ false }}">
          <div style="{{b.slRow}}">
            <span style="flex: none; font-size: 12px; color: rgba(255,255,255,.4); min-width: 18px; text-align: right">{{b.minLabel}}</span>
            <div onPointerDown="{{b.sl.down}}" onPointerMove="{{b.sl.move}}" onPointerUp="{{b.sl.up}}" onPointerCancel="{{b.sl.cancel}}" onDoubleClick="{{b.sl.reset}}" style="{{b.slWrap}}">
              <div style="{{b.sl.track}}"><div style="{{b.sl.fill}}"></div></div>
              <div style="{{b.sl.knob}}"></div>
              <input type="range" aria-label="{{b.title}}" min="0" max="1000" step="1" value="{{b.sl.k1000}}" onInput="{{b.sl.key}}" tabindex="0" style="position: absolute; inset: 0; width: 100%; height: 100%; margin: 0; opacity: 0; pointer-events: none">
            </div>
            <span style="flex: none; font-size: 12px; color: rgba(255,255,255,.4); min-width: 18px">{{b.maxLabel}}</span>
          </div>
        </sc-if>
        <sc-if value="{{b.isSeg}}" hint-placeholder-val="{{ false }}">
          <div role="radiogroup" aria-label="{{b.title}}" style="{{b.seg.track}}">
            <div style="{{b.seg.thumb}}"></div>
            <sc-for list="{{b.seg.segs}}" as="sg" hint-placeholder-count="3">
              <button role="radio" onClick="{{sg.pick}}" aria-checked="{{sg.on}}" style="{{sg.style}}">{{sg.label}}</button>
            </sc-for>
          </div>
        </sc-if>
        <sc-if value="{{b.isEditing}}" hint-placeholder-val="{{ false }}">
          <div style="display: flex; align-items: center; gap: 10px; margin: -4px 16px 10px">
            <input aria-label="{{b.title}}" value="{{b.value}}" onInput="{{b.typeIn}}" style="flex: 1; min-width: 0; height: 38px; padding: 0 12px; border: 0; border-radius: 12px; background: #3A3A3C; color: #FFFFFF; font: inherit; font-size: 16px; outline: none">
            <button onClick="{{b.doneEdit}}" style="height: 38px; padding: 0 4px; border: 0; background: transparent; color: #FFD60A; font: inherit; font-size: 16px; font-weight: 600; cursor: pointer">Готово</button>
          </div>
        </sc-if>
        <sc-if value="{{b.isCurve}}" hint-placeholder-val="{{ false }}">
          <svg width="100%" height="130" viewBox="0 0 300 130" aria-hidden="true" style="display: block; margin: -4px 0 12px">
            <path d="M16 10V120H290" fill="none" stroke="rgba(84,84,88,.8)" stroke-width="1.5"/>
            <path d="M16 120 L290 10" fill="none" stroke="rgba(84,84,88,.8)" stroke-width="1" stroke-dasharray="4 4"/>
            <path d="{{b.curve}}" fill="none" stroke="#FFD60A" stroke-width="3" stroke-linecap="round"/>
          </svg>
        </sc-if>
      </div>
    </sc-if>
  </sc-for>

  <sc-if value="{{menuOpen}}" hint-placeholder-val="{{ false }}">
    <button aria-label="Закрыть меню" onClick="{{closeMenu}}" style="position: fixed; inset: 0; border: 0; padding: 0; background: rgba(0,0,0,.18); cursor: default; z-index: 5; animation: iosFade .2s"></button>
    <div role="menu" aria-label="{{menu.title}}" style="{{menu.style}}">
      <span style="padding: 12px 18px 6px; font-size: 13px; line-height: 17px; color: rgba(255,255,255,.55)">{{menu.title}}</span>
      <sc-for list="{{menu.items}}" as="it" hint-placeholder-count="4">
        <button class="mi" role="menuitemradio" aria-checked="{{it.on}}" onClick="{{it.pick}}" style="{{it.style}}">
          <span style="width: 18px; flex: none; display: flex; justify-content: center">
            <sc-if value="{{it.checked}}" hint-placeholder-val="{{ false }}">
              <svg width="15" height="13" viewBox="0 0 15 13" fill="none" stroke="#FFD60A" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M1.5 7l4 4.2 8-9.7"/></svg>
            </sc-if>
          </span>
          <span style="flex: 1; min-width: 0; text-align: left; overflow-wrap: anywhere">{{it.label}}</span>
        </button>
      </sc-for>
    </div>
  </sc-if>

  <sc-if value="{{alertOpen}}" hint-placeholder-val="{{ false }}">
    <div style="position: fixed; inset: 0; z-index: 8; background: rgba(0,0,0,.45); display: flex; align-items: center; justify-content: center; animation: iosFade .2s">
      <div role="alertdialog" aria-label="{{alert.title}}" style="width: 290px; box-sizing: border-box; padding: 20px 16px 16px; border-radius: 30px; background: rgba(38,38,40,.88); -webkit-backdrop-filter: blur(30px) saturate(1.8); backdrop-filter: blur(30px) saturate(1.8); box-shadow: inset 0 0 0 .5px rgba(255,255,255,.14), 0 24px 60px rgba(0,0,0,.5); text-align: center; animation: iosAlertIn .35s cubic-bezier(.34,1.4,.64,1)">
        <div style="font-size: 17px; line-height: 22px; font-weight: 700">{{alert.title}}</div>
        <div style="margin-top: 6px; font-size: 14px; line-height: 19px; color: rgba(255,255,255,.7)">{{alert.msg}}</div>
        <div style="display: flex; gap: 8px; margin-top: 18px">
          <button onClick="{{alert.no}}" style="flex: 1; height: 46px; border: 0; border-radius: 23px; background: rgba(118,118,128,.3); color: #FFFFFF; font: inherit; font-size: 17px; font-weight: 600; cursor: pointer">Отмена</button>
          <button onClick="{{alert.yes}}" style="flex: 1; height: 46px; border: 0; border-radius: 23px; background: rgba(118,118,128,.3); color: #FF453A; font: inherit; font-size: 17px; font-weight: 600; cursor: pointer">{{alert.yesLabel}}</button>
        </div>
      </div>
    </div>
  </sc-if>

  <sc-if value="{{hasToast}}" hint-placeholder-val="{{ false }}">
    <div role="status" style="position: fixed; left: 50%; top: 12px; transform: translateX(-50%); z-index: 9; max-width: 340px; min-height: 40px; box-sizing: border-box; padding: 10px 18px; border-radius: 20px; background: rgba(20,20,22,.92); -webkit-backdrop-filter: blur(24px) saturate(1.8); backdrop-filter: blur(24px) saturate(1.8); box-shadow: inset 0 0 0 .5px rgba(255,255,255,.15), 0 10px 30px rgba(0,0,0,.45); color: #FFFFFF; font-size: 14px; line-height: 20px; font-weight: 600; text-align: center; animation: iosHud .45s cubic-bezier(.34,1.5,.64,1)">{{toast}}</div>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  static TREE = {"Y":"p","T":"Настройки камеры","K":"prefscreen","C":[{"Y":"g","T":"Режим обработки","S":"Быстрый — снимок готов заметно быстрее. Качество — дольше, но чище на движении, воде и мелких деталях.","K":"pref_scam_hybrid_processing","I":"settings_ic_sliders","E":["Быстрый","Качество"],"V":["fast","quality"],"D":"fast"},{"Y":"g","T":"Подавление аберраций","S":"Как убираются цветные каймы на краях у яркого света. Нейросеть — чище края, настоящие цвета предметов на месте. Классическое — прежний способ.","K":"pref_scam_hybrid_fringe_method","I":"settings_ic_palette","E":["Нейросеть","Классическое"],"V":["neural","classic"],"D":"classic"},{"Y":"p","T":"Настройки нейросети","S":"Насколько сильно и где нейросеть убирает цветную кайму","K":"fringe_net_screen","I":"settings_ic_chip","C":[{"Y":"s","T":"Сила","S":"Какая доля поправки нейросети попадёт в фото. 0 — никакой.","K":"pref_scam_hybrid_fringe_net_strength","I":"settings_ic_sliders","D":"1","m":"0","x":"1","u":"100","f":"true"},{"Y":"g","T":"Ширина каймы","S":"Широкая убирает и кайму до 12 пикселей от яркого края (рамы окон на фоне неба). Узкая — чуть быстрее.","K":"pref_scam_hybrid_fringe_net_reach","I":"settings_ic_ratio","E":["Узкая","Широкая"],"V":["6","12"],"D":"12"},{"Y":"s","T":"С какого оттенка","S":"Меньше — убираются и синеватые каймы. Больше — только фиолетовые и пурпурные.","K":"pref_scam_hybrid_fringe_net_hue","I":"settings_ic_palette","D":"205","m":"180","x":"260","u":"1"},{"Y":"s","T":"Во сколько раз ярче свет рядом","S":"Кайма убирается только рядом со светом, который во столько раз ярче. Больше — затрагивается меньше мест.","K":"pref_scam_hybrid_fringe_net_near","I":"settings_ic_sun","D":"1.5","m":"1.1","x":"4","u":"10","f":"true"},{"Y":"s","T":"Яркость этого света","S":"Насколько ярким должен быть этот свет, в долях белого. Меньше — убирается кайма и у более тусклых источников.","K":"pref_scam_hybrid_fringe_net_light","I":"settings_ic_sun","D":"0.12","m":"0.02","x":"0.6","u":"100","f":"true       r.rowStyle = 'background: #2C2C2E; overflow: hidden; border-radius: ' + top + 'px ' + top + 'px ' + bottom + 'px ' + bottom + 'px' + (i === rows.length - 1 ? '; margin-bottom: 4px' : '')
        + (r.flash ? '; animation: camFlash 1.4s ease-in-out 2' : ''); }); return rows; };
    const header = (t, first) => ({ isHeader: true, isRow: false, isNote: false, title: t,
      hStyle: 'padding: ' + (first ? '6px' : '22px') + ' 16px 8px; font-size: 12px; line-height: 16px; font-weight: 600; letter-spacing: 1px; text-transform: uppercase; color: ' + SEC });
    const note = (t) => ({ isNote: true, isRow: false, isHeader: false, title: t });
    let blocks = [];
    const q = st.q.trim().toLowerCase();
    if (node.id === 0 && q) {
      const hits = ALL.filter((n) => n.Y !== 'c' && n.id !== 0 && ((n.T || '') + ' ' + (n.S || '')).toLowerCase().indexOf(q) >= 0).slice(0, 40);
      blocks.push(header('Найдено: ' + hits.length + (hits.length === 40 ? '+' : ''), true));
      const rows = hits.map((n) => {
        let p = n.parent; const path = []; while (p && p.id !== 0) { if (p.T) p.Y === 'p' && path.unshift(p.T); p = p.parent; }
        const screen = (() => { let s = n.parent; while (s && s.Y === 'c') s = s.parent; return s; })();
        const r = { ...blank(), title: n.T || '', sub: path.join(' › ') || 'Настройки', hasSub: true, hasIcon: !!n.I, d: n.I ? tileFor(n.I).d : '', tile: n.I ? tileFor(n.I).style : '', hasChevron: true, aria: n.T || '' };
        r.tap = () => { const chain = []; let s = isScreen(n) ? n : screen; while (s && s.id !== 0) { if (s.Y === 'p') chain.unshift(s.id); s = s.parent; }
          set({ stack: [0, ...chain], q: '', flash: n.id }); clearTimeout(this._f); this._f = setTimeout(() => this.setState({ flash: null }), 3000); };
        return r;
      });
      blocks = blocks.concat(group(rows));
      if (!hits.length) blocks.push(note('Ничего не найдено. Попробуйте другое слово: «шум», «резкость», «RAW», «кадры».'));
    } else {
      const kids = node.C || [];
      if (!kids.filter((k) => k.K !== 'lens_screen').length && node.K !== 'modules_screen') blocks.push(note('В приложении этот раздел собирается под конкретный телефон и его камеры. В прототипе он пустой.'));
      let loose = [], first = true;
      const flush = () => { if (loose.length) { blocks = blocks.concat(rowsOf(loose)); loose = []; first = false; } };
      kids.forEach((k) => {
        if (k.Y === 'c') {
          flush();
          blocks.push(header(k.T || '', first)); first = false;
          if (k.K === 'root_modules') {
            const lens = ALL.find((x) => x.K === 'lens_screen');
            const mods = [['Основная · 1×', 'ID 0 · 50 Мп'], ['Сверхширокая · 0,6×', 'ID 2 · 50 Мп'], ['Телефото · 3,7×', 'ID 3 · 200 Мп'], ['Фронтальная', 'ID 1 · 50 Мп']];
            blocks = blocks.concat(group(mods.map(([t, s]) => ({ ...blank(), title: t, sub: s + ' (пример)', hasSub: true, hasIcon: true, d: tileFor('settings_ic_lenses').d, tile: tileFor('settings_ic_lenses').style,
              hasChevron: true, aria: t, tap: () => push(lens, t) }))));
          }
          const inner = [], subcats = [];
          (k.C || []).forEach((c) => c.Y === 'c' ? subcats.push(c) : inner.push(c));
          if (inner.length) blocks = blocks.concat(rowsOf(inner));
          subcats.forEach((c) => { blocks.push(header(c.T || '', false)); blocks = blocks.concat(rowsOf(c.C || [])); });
        } else loose.push(k);
      });
      flush();
    }
    // the menu
    const m = st.menu;
    let menu = { title: '', items: [], style: '' };
    if (m) {
      const vh = (typeof window !== 'undefined' && window.innerHeight) || 844;
      const h = Math.min(vh - 24, 40 + m.items.length * 46);
      let top = m.bottom + 6, below = true;
      if (top + h > vh - 12) { top = m.top - h - 6; below = false; }
      if (top < 12) { top = Math.max(12, (vh - h) / 2); }
      menu = { title: m.title,
        style: 'position: fixed; right: 20px; top: ' + top.toFixed(0) + 'px; width: 262px; max-height: ' + h + 'px; overflow-y: auto; z-index: 6; box-sizing: border-box; padding: 0 0 6px; border-radius: 26px; display: flex; flex-direction: column; '
          + 'background: rgba(44,44,46,.86); -webkit-backdrop-filter: blur(30px) saturate(1.8); backdrop-filter: blur(30px) saturate(1.8); box-shadow: inset 0 0 0 .5px rgba(255,255,255,.14), 0 18px 50px rgba(0,0,0,.55); transform-origin: '
          + (below ? 'top right' : 'bottom right') + '; animation: ' + (st.menuOut ? 'iosMenuOut .17s ease-in forwards' : 'iosMenuIn .42s cubic-bezier(.34,1.3,.64,1)'),
        items: m.items.map(([label, v]) => ({ label, on: v === m.cur ? 'true' : 'false', checked: v === m.cur,
          pick: () => { m.pick(v); closeMenu(); },
          style: 'display: flex; align-items: center; gap: 8px; min-height: 46px; padding: 6px 18px 6px 12px; border: 0; background: transparent; cursor: pointer; font: inherit; font-size: 16px; line-height: 21px; color: #FFFFFF; transition: background .15s' })) };
    }
    const al = st.alert;
    const pageKeys = []; const collect = (n) => { if (n.K) pageKeys.push(n.K); (n.C || []).forEach((c) => { if (c.Y !== 'p') collect(c); }); }; collect(node);
    const crumbParts = st.stack.slice(1, -1).map((id) => st.titles[id] || ALL[id].T).filter(Boolean);
    const title = node.id === 0 ? 'Настройки' : (st.titles[node.id] || node.T || '');
    return {
      blocks, atRoot: node.id === 0, notRoot: node.id !== 0, title,
      titleStyle: 'margin: 14px 4px 12px; line-height: 1.12; font-weight: 700; letter-spacing: -0.4px; font-size: ' + (title.length > 24 ? '26px' : title.length > 16 ? '30px' : '34px'),
      crumb: ['Настройки', ...crumbParts].join(' › '), hasPageSummary: node.id !== 0 && !!node.S, pageSummary: node.S || '',
      roundBtn: 'width: 40px; height: 40px; flex: none; border: 0; padding: 0; border-radius: 20px; background: #2C2C2E; color: #FFFFFF; display: flex; align-items: center; justify-content: center; cursor: pointer',
      back: () => set({ stack: st.stack.slice(0, -1), editing: null, menu: null }),
      resetPage: () => ask('Сбросить «' + title + '»?', 'Пункты этой страницы вернутся к значениям по умолчанию.', 'Сбросить', () => { const v = { ...this.state.v }; pageKeys.forEach((k) => delete v[k]); set({ v, alert: null }); toast('Страница сброшена'); }),
      q: st.q, hasQ: !!st.q, setQ: (e) => set({ q: e.target.value }), clearQ: () => set({ q: '' }),
      menuOpen: !!m, menu, closeMenu,
      alertOpen: !!al, alert: al ? { title: al.title, msg: al.msg, yesLabel: al.yesLabel, yes: al.yes, no: () => set({ alert: null }) } : { title: '', msg: '', yesLabel: '', yes: () => {}, no: () => {} },
      hasToast: !!st.toast, toast: st.toast || ''
    };
  }
}
</script>
