<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Симуляция плёнки</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Roboto+Flex:opsz,wght@8..144,400;8..144,500;8..144,600;8..144,700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#000000}
*{-webkit-tap-highlight-color:transparent}
button:focus{outline:none}
@keyframes iosKnobA{0%{transform:scale(1)}30%{transform:scale(1.2,.84)}60%{transform:scale(.94,1.07)}100%{transform:scale(1)}}
@keyframes iosKnobB{0%{transform:scale(1)}30%{transform:scale(1.2,.84)}60%{transform:scale(.94,1.07)}100%{transform:scale(1)}}
@keyframes iosPopA{0%{transform:scale(1)}35%{transform:scale(1.22)}100%{transform:scale(1)}}
@keyframes iosPopB{0%{transform:scale(1)}35%{transform:scale(1.22)}100%{transform:scale(1)}}
@keyframes iosMenuIn{0%{transform:scale(.25);opacity:0;filter:blur(6px)}60%{opacity:1;filter:blur(0)}100%{transform:scale(1);opacity:1}}
@keyframes iosMenuOut{to{transform:scale(.6);opacity:0;filter:blur(4px)}}
@keyframes iosFade{from{opacity:0}to{opacity:1}}
@keyframes iosAlertIn{0%{transform:scale(1.15);opacity:0}100%{transform:scale(1);opacity:1}}
@keyframes iosHud{0%{transform:translate(-50%,-30px) scale(.8);opacity:0}100%{transform:translate(-50%,0) scale(1);opacity:1}}
@keyframes iosFlash{0%,100%{background:#1C1C1E}25%,60%{background:#3A3A3C}}

a{color:inherit;text-decoration:none}a:hover{color:inherit}
</style>
</helmet>
<div style="width: 390px; min-height: 1240px; box-sizing: border-box; padding: 18px 14px 40px; font-family: 'Roboto Flex', -apple-system, system-ui, sans-serif; background: #000000; color: #FFFFFF; -webkit-font-smoothing: antialiased; display: flex; flex-direction: column; gap: 14px">

  <div style="display: flex; align-items: center; gap: 12px">
    <a href="Viewfinder.dc.html" aria-label="Назад к видоискателю" style="width: 44px; height: 44px; flex: none; border-radius: 22px; background: rgba(52,54,60,.6); box-shadow: inset 0 0 0 0.5px rgba(255,255,255,.12), inset 0 1px 0 rgba(255,255,255,.1); display: flex; align-items: center; justify-content: center">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>
    </a>
    <h1 style="flex: 1; margin: 0; font-size: 26px; line-height: 32px; font-weight: 600; letter-spacing: -0.2px">Симуляция плёнки</h1>
    <button aria-label="Сбросить" style="width: 44px; height: 44px; flex: none; border: 0; padding: 0; border-radius: 22px; background: rgba(52,54,60,.6); box-shadow: inset 0 0 0 0.5px rgba(255,255,255,.12), inset 0 1px 0 rgba(255,255,255,.1); color: #FFFFFF; display: flex; align-items: center; justify-content: center; cursor: pointer">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 12a8 8 0 1 0 2.3-5.6 M4 4v4.5h4.5"/></svg>
    </button>
  </div>

  <button style="align-self: flex-start; height: 36px; padding: 0 14px; border: 0; border-radius: 18px; background: rgba(118,118,128,.24); color: #0A84FF; display: flex; align-items: center; gap: 6px; font: inherit; font-size: 14px; font-weight: 600; cursor: pointer">
    Настраивается: 1×
    <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg>
  </button>

  <div style="position: relative; height: 270px; border-radius: 26px; overflow: hidden; background: #1C1C1E">
    <svg width="100%" height="100%" viewBox="0 0 362 270" preserveAspectRatio="none" aria-hidden="true" style="position: absolute; inset: 0">
      <rect x="0" y="0" width="362" height="190" fill="{{sceneSkyA}}"/>
      <rect x="0" y="95" width="362" height="95" fill="{{sceneSkyB}}" opacity=".7"/>
      <circle cx="250" cy="120" r="34" fill="#F1E2C8"/>
      <path d="M0 150 C80 120 160 128 230 142 C290 152 330 140 362 136 L362 190 L0 190 Z" fill="#3F4A63"/>
      <path d="M0 190 L0 120 L22 160 L40 100 L62 150 L80 112 L100 160 L120 128 L150 190 Z" fill="#0F141C"/>
      <rect x="0" y="188" width="362" height="82" fill="#A88A86"/>
      <path d="M190 204 H300 M195 216 H292 M200 228 H288 M206 240 H282 M212 252 H276" stroke="#F1D7B6" stroke-width="4" stroke-linecap="round"/>
    </svg>
    <div style="{{afterStyle}}">
      <svg width="362" height="270" viewBox="0 0 362 270" preserveAspectRatio="none" aria-hidden="true" style="position: absolute; right: 0; top: 0">
        <rect x="0" y="0" width="362" height="190" fill="{{sceneSkyA}}"/>
        <rect x="0" y="95" width="362" height="95" fill="{{sceneSkyB}}" opacity=".7"/>
        <circle cx="250" cy="120" r="34" fill="#F1E2C8"/>
        <path d="M0 150 C80 120 160 128 230 142 C290 152 330 140 362 136 L362 190 L0 190 Z" fill="#3F4A63"/>
        <path d="M0 190 L0 120 L22 160 L40 100 L62 150 L80 112 L100 160 L120 128 L150 190 Z" fill="#0F141C"/>
        <rect x="0" y="188" width="362" height="82" fill="#A88A86"/>
        <path d="M190 204 H300 M195 216 H292 M200 228 H288 M206 240 H282 M212 252 H276" stroke="#F1D7B6" stroke-width="4" stroke-linecap="round"/>
      </svg>
    </div>
    <div style="{{lineStyle}}"></div>
    <div style="{{handleStyle}}">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#000000" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l-5 6 5 6 M15 6l5 6-5 6"/></svg>
    </div>
    <span style="position: absolute; left: 12px; top: 12px; height: 26px; padding: 0 10px; border-radius: 13px; background: rgba(17,19,24,.75); font-size: 13px; font-weight: 600; display: flex; align-items: center">До</span>
    <span style="position: absolute; right: 12px; top: 12px; height: 26px; padding: 0 10px; border-radius: 13px; background: rgba(17,19,24,.75); font-size: 13px; font-weight: 600; display: flex; align-items: center">После</span>
    <input type="range" min="10" max="90" value="{{split}}" onInput="{{setSplit}}" aria-label="Граница до и после" style="position: absolute; inset: 0; width: 100%; height: 100%; margin: 0; opacity: 0; cursor: ew-resize">
  </div>

  <div style="display: flex; gap: 8px">
    <sc-for list="{{scenes}}" as="s" hint-placeholder-count="3">
      <button onClick="{{s.pick}}" aria-pressed="{{s.pressed}}" style="{{s.style}}">{{s.label}}</button>
    </sc-for>
  </div>

  <div role="tablist" style="{{secK.track}}">
    <div style="{{secK.thumb}}"></div>
    <sc-for list="{{sections}}" as="t" hint-placeholder-count="4">
      <button role="tab" aria-selected="{{t.selected}}" onClick="{{t.pick}}" style="{{t.style}}">{{t.label}}</button>
    </sc-for>
  </div>

  <sc-if value="{{showCards}}" hint-placeholder-val="{{ true }}">
    <div style="display: flex; flex-direction: column; gap: 8px">
      <div style="display: flex; gap: 8px; overflow-x: auto; padding-bottom: 4px">
        <sc-for list="{{cards}}" as="c" hint-placeholder-count="5">
          <button onClick="{{c.pick}}" aria-pressed="{{c.pressed}}" style="{{c.style}}">
            <span style="font-size: 11px; font-weight: 600; letter-spacing: 1px; opacity: .75">{{c.brand}}</span>
            <span style="font-size: 18px; font-weight: 600; line-height: 22px">{{c.name}}</span>
            <span style="flex: 1"></span>
            <span style="font-size: 12.5px; line-height: 16px; color: rgba(235,235,245,.6)">{{c.kind}}</span>
          </button>
        </sc-for>
      </div>
      <span style="padding: 0 6px; font-size: 14px; color: rgba(235,235,245,.6)">{{cardNote}}</span>
    </div>
  </sc-if>

  <sc-if value="{{showFormats}}" hint-placeholder-val="{{ false }}">
    <div style="display: flex; flex-wrap: wrap; gap: 8px">
      <sc-for list="{{formats}}" as="f" hint-placeholder-count="10">
        <button onClick="{{f.pick}}" aria-pressed="{{f.pressed}}" style="{{f.style}}">{{f.label}}</button>
      </sc-for>
    </div>
    <span style="padding: 0 6px; font-size: 14px; line-height: 19px; color: rgba(235,235,245,.6)">Размер кадра плёнки: от него зависят зерно и ореол на снимке.</span>
  </sc-if>

  <sc-if value="{{showEffects}}" hint-placeholder-val="{{ false }}">
    <div style="display: flex; flex-direction: column; gap: 10px">
      <span style="padding: 0 16px; font-size: 13px; letter-spacing: .3px; text-transform: uppercase; color: rgba(235,235,245,.6)">Диффузия</span>
      <div style="display: flex; gap: 6px; overflow-x: auto">
        <sc-for list="{{diffusions}}" as="d" hint-placeholder-count="5">
          <button onClick="{{d.pick}}" aria-pressed="{{d.pressed}}" style="{{d.style}}">{{d.label}}</button>
        </sc-for>
      </div>
      <div style="display: flex; flex-direction: column; border-radius: 26px; overflow: hidden; background: #1C1C1E">
        <sc-for list="{{fx}}" as="x" hint-placeholder-count="7">
          <div style="{{x.row}}">
            <div style="display: flex; justify-content: space-between; align-items: baseline; gap: 10px; font-size: 17px"><span>{{x.name}}</span><span style="{{x.valStyle}}">{{x.value}}</span></div>
            <div onPointerDown="{{x.sl.down}}" onPointerMove="{{x.sl.move}}" onPointerUp="{{x.sl.up}}" onPointerCancel="{{x.sl.cancel}}" onDoubleClick="{{x.sl.reset}}" style="{{x.sl.wrap}}">
              <div style="{{x.sl.track}}"><div style="{{x.sl.fill}}"></div></div>
              <div style="{{x.sl.knob}}"></div>
              <input type="range" aria-label="{{x.name}}" min="0" max="1000" step="1" value="{{x.sl.k1000}}" onInput="{{x.sl.key}}" style="position: absolute; inset: 0; width: 100%; height: 100%; margin: 0; opacity: 0; pointer-events: none">
            </div>
          </div>
        </sc-for>
      </div>
    </div>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":1240}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { split: 42, scene: 'land', section: 'film', film: 2, print: 0, format: 6, diff: 2 }; }
  /* <ios-kit> shared iOS controls of the concept (the same code in every artboard) */
  // slider: drag anywhere (relative, no jump), tap jumps, double tap resets; rubber band past the ends, glass knob while held, spring on release
  iosSlider(id, k, onK, o) {
    o = o || {};
    const st = this.state, ACC = o.acc || '#0A84FF', SPR = 'cubic-bezier(.34,1.56,.64,1)';
    const clamp = (x) => Math.max(0, Math.min(1, x));
    const d = st.drag && st.drag.id === id ? st.drag : null;
    const n = (st.bump && st.bump[id]) || 0;
    const pos = 'calc(14px + ' + clamp(k).toFixed(4) + ' * (100% - 28px))', over = d ? d.over : 0, live = !!(d && d.moving);
    const w = (this._sl && this._sl.id === id && this._sl.w) || 300;
    const bump = () => { const b = { ...(this.state.bump || {}) }; b[id] = (b[id] || 0) + 1; this.setState({ drag: null, bump: b });
      clearTimeout(this['_b' + id]); this['_b' + id] = setTimeout(() => { const c = { ...(this.state.bump || {}) }; delete c[id]; this.setState({ bump: c }); }, 700); };
    const end = (e, cancel) => { const s = this._sl; if (!s || s.id !== id) return; this._sl = null;
      if (!cancel && !s.moved && e && e.clientX != null) onK(clamp((e.clientX - s.r.left - 14) / Math.max(1, s.r.width - 28)));
      bump(); };
    const anim = (a, b) => n ? '; animation: ' + (n % 2 ? a : b) + ' .55s ' + SPR : '';
    return {
      down: (e) => { const el = e.currentTarget, r = el.getBoundingClientRect(); try { el.setPointerCapture(e.pointerId); } catch (x) { /* old browsers */ }
        this._sl = { id, r, w: Math.max(1, (r.width || 300) - 28), x0: e.clientX, k0: clamp(k), moved: false }; this.setState({ drag: { id, over: 0, moving: false } }); },
      move: (e) => { const s = this._sl; if (!s || s.id !== id) return; const dx = e.clientX - s.x0;
        if (!s.moved && Math.abs(dx) < 4) return; s.moved = true;
        const raw = s.k0 + dx / s.w, ex = raw < 0 ? raw * s.w : raw > 1 ? (raw - 1) * s.w : 0;
        onK(clamp(raw)); this.setState({ drag: { id, over: Math.sign(ex) * 20 * (1 - Math.exp(-Math.abs(ex) / 70)), moving: true } }); },
      up: (e) => end(e, false), cancel: (e) => end(e, true),
      reset: () => { if (o.def != null) { onK(o.def); bump(); } },
      key: (e) => { onK(clamp(Number(e.target.value) / 1000)); },
      k1000: Math.round(clamp(k) * 1000),
      wrap: 'position: relative; height: 38px; touch-action: pan-y; cursor: pointer; user-select: none; -webkit-user-select: none',
      track: 'position: absolute; left: 0; right: 0; top: 50%; height: ' + (d ? 9 : 6) + 'px; margin-top: ' + (d ? -4.5 : -3) + 'px; border-radius: 5px; overflow: hidden; background: rgba(120,120,128,.36); transform-origin: '
        + (over < 0 ? 'right' : 'left') + '; transform: ' + (over ? 'scaleX(' + (1 + Math.abs(over) / w).toFixed(4) + ')' : 'none')
        + '; transition: ' + (live ? 'height .25s ' + SPR + ', margin .25s ' + SPR : 'transform .6s ' + SPR + ', height .35s ' + SPR + ', margin .35s ' + SPR),
      fill: 'height: 100%; width: ' + pos + '; background: ' + ACC + '; transition: width ' + (live ? '.05s linear' : '.5s ' + SPR),
      knob: 'position: absolute; top: 50%; left: ' + pos + '; width: ' + (d ? 42 : 28) + 'px; height: ' + (d ? 26 : 28) + 'px; margin: ' + (d ? '-13px 0 0 -21px' : '-14px 0 0 -14px')
        + '; border-radius: 14px; pointer-events: none; translate: ' + (over * .9).toFixed(1) + 'px 0; '
        + (d ? 'background: rgba(255,255,255,.18); -webkit-backdrop-filter: blur(2px) saturate(2); backdrop-filter: blur(2px) saturate(2); box-shadow: inset 0 0 0 1.5px rgba(255,255,255,.9), inset 0 -6px 10px rgba(255,255,255,.25), 0 8px 20px rgba(0,0,0,.35)'
          : 'background: #FFFFFF; box-shadow: 0 2px 8px rgba(0,0,0,.35), 0 0 0 .5px rgba(0,0,0,.05)')
        + '; transition: left ' + (live ? '.05s linear' : '.5s ' + SPR) + ', translate ' + (live ? '.05s linear' : '.6s ' + SPR) + ', width .4s ' + SPR + ', height .4s ' + SPR + ', margin .4s ' + SPR + ', background .25s, box-shadow .25s'
        + (d ? '' : anim('iosKnobA', 'iosKnobB')),
      value: (base) => base + '; display: inline-block; transform-origin: right center; transition: transform .45s ' + SPR + ', color .2s; transform: scale(' + (d ? 1.16 : 1) + ')'
        + (d ? '; color: ' + ACC : '') + (d ? '' : anim('iosPopA', 'iosPopB'))
    };
  }
  // segmented control with a sliding thumb
  iosSeg(items, cur, pick, o) {
    o = o || {};
    const k = items.length, i = Math.max(0, items.findIndex((x) => x[1] === cur)), SPR = 'cubic-bezier(.34,1.4,.64,1)';
    return {
      track: 'position: relative; display: grid; grid-template-columns: repeat(' + k + ', minmax(0, 1fr)); padding: 3px; border-radius: 20px; background: rgba(118,118,128,.24)' + (o.margin ? '; margin: ' + o.margin : ''),
      thumb: 'position: absolute; top: 3px; bottom: 3px; left: calc(3px + ' + i + ' * (100% - 6px) / ' + k + '); width: calc((100% - 6px) / ' + k + '); border-radius: 17px; background: ' + (o.thumb || '#636366')
        + '; box-shadow: 0 3px 8px rgba(0,0,0,.25), 0 0 0 .5px rgba(0,0,0,.04); transition: left .45s ' + SPR + '; pointer-events: none',
      segs: items.map(([label, v]) => ({ label, on: v === cur ? 'true' : 'false', pick: () => pick(v),
        style: 'position: relative; min-height: 34px; padding: 4px 6px; border: 0; background: transparent; cursor: pointer; font: inherit; font-size: 13px; line-height: 16px; font-weight: 600; transition: color .2s; color: '
          + (v === cur ? (o.onInk || '#FFFFFF') : 'rgba(235,235,245,.75)') }))
    };
  }
  // switch
  iosSwitch(on, o) {
    o = o || {};
    const SPR = 'cubic-bezier(.34,1.5,.64,1)';
    return {
      track: 'position: relative; width: 51px; height: 31px; flex: none; border-radius: 16px; transition: background .3s; background: ' + (on ? (o.acc || '#30D158') : 'rgba(120,120,128,.32)'),
      knob: 'position: absolute; top: 2px; left: ' + (on ? 22 : 2) + 'px; width: 27px; height: 27px; border-radius: 14px; background: #FFFFFF; box-shadow: 0 3px 8px rgba(0,0,0,.15), 0 3px 1px rgba(0,0,0,.06); transition: left .4s ' + SPR
    };
  }
  /* </ios-kit> */
  renderVals() {
    const st = this.state, P = '#0A84FF', ONP = '#FFFFFF';
    const chip = (on) => 'height: 40px; padding: 0 16px; border: 0; border-radius: 20px; cursor: pointer; font: inherit; font-size: 14px; font-weight: 600; white-space: nowrap; flex: none; '
      + (on ? 'background: ' + P + '; color: ' + ONP : 'background: rgba(118,118,128,.24); color: #FFFFFF') + '; transition: background .25s, transform .35s cubic-bezier(.34,1.56,.64,1)' + (on ? '; transform: scale(1.04)' : '');
    const scenes = [['land', 'Пейзаж'], ['sunset', 'Закат'], ['scale', 'Шкала цветов']].map(([id, label]) => ({
      label, pressed: st.scene === id ? 'true' : 'false', pick: () => this.setState({ scene: id }), style: chip(st.scene === id) }));
    const secs = [['film', 'Плёнка'], ['print', 'Печать'], ['format', 'Формат'], ['effects', 'Эффекты']];
    const secK = this.iosSeg(secs.map(([id, label]) => [label, id]), st.section, (id) => this.setState({ section: id }));
    const sections = secK.segs.map((s) => ({ label: s.label, selected: s.on, pick: s.pick, style: s.style + '; font-size: 14px' }));
    const FILMS = [['KODAK', 'Portra 160', 'Цветной негатив · ISO 160'], ['KODAK', 'Portra 400', 'Цветной негатив · ISO 400'],
      ['KODAK', 'Portra 800', 'Цветной негатив · ISO 800'], ['KODAK', 'Ektar 100', 'Цветной негатив · ISO 100'],
      ['KODAK', 'Gold 200', 'Цветной негатив · ISO 200'], ['FUJIFILM', 'Pro 400H', 'Цветной негатив · ISO 400'],
      ['FUJIFILM', 'Velvia 100', 'Слайд · ISO 100'], ['FUJIFILM', 'Provia 100F', 'Слайд · ISO 100']];
    const PRINTS = [['KODAK', 'Endura Premier', 'Фотобумага'], ['KODAK', 'Supra Endura', 'Фотобумага'], ['KODAK', 'Portra Endura', 'Фотобумага'],
      ['FUJIFILM', 'Crystal Archive Type II', 'Фотобумага']];
    const isPrint = st.section === 'print';
    const src = isPrint ? PRINTS : FILMS, key = isPrint ? 'print' : 'film';
    const cards = src.map(([brand, name, kind], i) => {
      const on = st[key] === i;
      return { brand, name, kind, pressed: on ? 'true' : 'false', pick: () => this.setState({ [key]: i }),
        style: 'width: 150px; height: 124px; flex: none; box-sizing: border-box; padding: 14px; border: 0; border-radius: 22px; text-align: left; display: flex; flex-direction: column; gap: 4px; cursor: pointer; font: inherit; color: #FFFFFF; '
          + 'transition: box-shadow .25s, transform .4s cubic-bezier(.34,1.56,.64,1); ' + (on ? 'background: #1C1C1E; box-shadow: inset 0 0 0 2px ' + P + '; transform: scale(1.03)' : 'background: #1C1C1E; box-shadow: inset 0 0 0 .5px rgba(84,84,88,.65)') };
    });
    const sel = src[st[key]] || src[0];
    const FORMATS = ['8 mm', 'Super 8', '16 mm', 'Super 16', 'Super 35', '35 mm', '65 mm', '645', '6×7', 'IMAX 70'];
    const formats = FORMATS.map((label, i) => ({ label, pressed: st.format === i ? 'true' : 'false', pick: () => this.setState({ format: i }), style: chip(st.format === i) }));
    const DIFF = ['Нет', 'Glimmerglass', 'Black Pro-Mist', 'Pro-Mist', 'CineBloom'];
    const diffusions = DIFF.map((label, i) => ({ label, pressed: st.diff === i ? 'true' : 'false', pick: () => this.setState({ diff: i }), style: chip(st.diff === i) }));
    const pctF = (k) => Math.round(k * 100) + ' %', f2 = (k) => k.toFixed(2).replace('.', ','),
      evF = (k) => { const v = (k - .5) * 4; return (v >= 0 ? '+' : '−') + Math.abs(v).toFixed(2).replace('.', ',') + ' EV'; },
      pmF = (k) => { const v = Math.round((k - .5) * 200); return v > 0 ? '+' + v : v < 0 ? '−' + (-v) : '0'; };
    const FX = [['Сила фильтра', .5, f2], ['Зерно', 0, pctF], ['Ореол', 0, pctF], ['Мягкость плёнки', 0, pctF],
      ['Экспозиция печати', .5, evF], ['Контраст плёнки', .5, pmF], ['Сила симуляции', 1, pctF]];
    const fxv = st.fxv || {};
    const fx = FX.map(([name, k0, fmt], i) => {
      const k = fxv[name] != null ? fxv[name] : k0;
      const sl = this.iosSlider('fx' + i, k, (kk) => this.setState({ fxv: { ...(this.state.fxv || {}), [name]: kk } }), { acc: P, def: k0 });
      return { name, value: fmt(k), sl, valStyle: sl.value('color: rgba(235,235,245,.6); font-variant-numeric: tabular-nums'),
        row: 'display: flex; flex-direction: column; gap: 4px; padding: 12px 16px 8px' + (i ? '; box-shadow: inset 0 .5px 0 rgba(84,84,88,.65)' : '') };
    });
    const skies = { land: ['#C99A7A', '#E7B48C'], sunset: ['#B86C56', '#F0A060'], scale: ['#7A8CA6', '#C8B7A6'] };
    const sk = skies[st.scene];
    const s = st.split;
    return {
      scenes, sections, secK, cards, formats, diffusions, fx, split: s,
      setSplit: (e) => this.setState({ split: Number(e.target.value) }),
      sceneSkyA: sk[0], sceneSkyB: sk[1],
      afterStyle: 'position: absolute; top: 0; bottom: 0; right: 0; width: ' + (100 - s) + '%; overflow: hidden; filter: sepia(.28) saturate(1.25) brightness(1.06) contrast(.94)',
      lineStyle: 'position: absolute; top: 0; bottom: 0; left: calc(' + s + '% - 1px); width: 2px; background: #FFFFFF',
      handleStyle: 'position: absolute; top: 50%; left: ' + s + '%; width: 40px; height: 40px; margin: -20px 0 0 -20px; border-radius: 20px; background: #FFFFFF; box-shadow: 0 4px 12px rgba(0,0,0,.35); display: flex; align-items: center; justify-content: center; pointer-events: none',
      showCards: st.section === 'film' || isPrint, showFormats: st.section === 'format', showEffects: st.section === 'effects',
      cardNote: sel[1] + ' · ' + sel[2]
    };
  }
}
</script>
</body>
</html>
