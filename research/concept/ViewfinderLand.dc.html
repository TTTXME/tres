<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Видоискатель, горизонтально</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Roboto+Flex:opsz,wght@8..144,400;8..144,500;8..144,600;8..144,700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#000000}
</style>
</helmet>
<div style="position: relative; width: 844px; height: 390px; overflow: hidden; background: #000000; color: #FFFFFF; font-family: 'Roboto Flex', -apple-system, system-ui, sans-serif; -webkit-font-smoothing: antialiased">

  <button aria-label="Изменить верхнюю строку (свайп от края)" style="position: absolute; left: 3px; top: 50%; margin-top: -22px; width: 10px; height: 44px; border: 0; padding: 0; background: transparent; cursor: pointer; display: flex; align-items: center; justify-content: center">
    <span style="width: 4px; height: 36px; border-radius: 2px; background: rgba(255,255,255,.35)"></span>
  </button>

  <div style="position: absolute; left: 16px; top: 0; bottom: 0; width: 48px; display: flex; flex-direction: column; justify-content: center; align-items: center; gap: 14px">
    <sc-for list="{{side}}" as="b" hint-placeholder-count="5">
      <button aria-label="{{b.name}}" aria-pressed="{{b.pressed}}" onClick="{{b.flip}}" style="{{b.style}}">
        <sc-if value="{{b.isText}}" hint-placeholder-val="{{ false }}">
          <span style="display: flex; flex-direction: column; align-items: center; line-height: 1; gap: 3px"><span style="font-size: 13px; font-weight: 700">{{b.text}}</span><span style="font-size: 9px; font-weight: 600; opacity: .85">{{b.sub}}</span></span>
        </sc-if>
        <sc-if value="{{b.isIcon}}" hint-placeholder-val="{{ true }}">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="{{b.fill}}" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{b.d}}"/></svg>
        </sc-if>
      </button>
    </sc-for>
  </div>

  <div style="position: absolute; left: 72px; top: 0; width: 520px; height: 390px; overflow: hidden; border-radius: 28px; background: linear-gradient(170deg, #3A4656 0%, #1E2630 55%, #0F1318 100%)">
    <div style="position: absolute; left: 33.33%; top: 0; bottom: 0; width: 1px; background: rgba(255,255,255,.28)"></div>
    <div style="position: absolute; left: 66.66%; top: 0; bottom: 0; width: 1px; background: rgba(255,255,255,.28)"></div>
    <div style="position: absolute; top: 33.33%; left: 0; right: 0; height: 1px; background: rgba(255,255,255,.28)"></div>
    <div style="position: absolute; top: 66.66%; left: 0; right: 0; height: 1px; background: rgba(255,255,255,.28)"></div>
    <div style="position: absolute; left: 0; right: 0; top: 60px; text-align: center; font-size: 13px; color: rgba(255,255,255,.4)">Изображение с камеры</div>
    <div style="position: absolute; left: 222px; top: 157px; width: 76px; height: 76px">
      <span style="position: absolute; left: 0; top: 0; width: 14px; height: 14px; border-left: 1.5px solid #FFD60A; border-top: 1.5px solid #FFD60A; border-top-left-radius: 6px"></span>
      <span style="position: absolute; right: 0; top: 0; width: 14px; height: 14px; border-right: 1.5px solid #FFD60A; border-top: 1.5px solid #FFD60A; border-top-right-radius: 6px"></span>
      <span style="position: absolute; left: 0; bottom: 0; width: 14px; height: 14px; border-left: 1.5px solid #FFD60A; border-bottom: 1.5px solid #FFD60A; border-bottom-left-radius: 6px"></span>
      <span style="position: absolute; right: 0; bottom: 0; width: 14px; height: 14px; border-right: 1.5px solid #FFD60A; border-bottom: 1.5px solid #FFD60A; border-bottom-right-radius: 6px"></span>
    </div>
    <div style="position: absolute; left: 309px; top: 147px; width: 22px; height: 96px; display: flex; flex-direction: column; align-items: center">
      <div style="flex: 1; width: 1.5px; background: rgba(255,214,10,.8)"></div>
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#FFD60A" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M12 8a4 4 0 1 0 0 8a4 4 0 1 0 0-8z M12 2.5v2 M12 19.5v2 M2.5 12h2 M19.5 12h2 M5.3 5.3l1.4 1.4 M17.3 17.3l1.4 1.4 M5.3 18.7l1.4-1.4 M17.3 6.7l1.4-1.4"/></svg>
      <div style="flex: 1.4; width: 1.5px; background: rgba(255,214,10,.8)"></div>
    </div>
  </div>

  <div style="position: absolute; left: 604px; top: 50%; transform: translateY(-50%); display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 3px; border-radius: 26px; background: #1C1C1E; box-shadow: inset 0 0 0 0.5px rgba(255,255,255,.1)">
    <sc-for list="{{zooms}}" as="z" hint-placeholder-count="4">
      <button aria-label="{{z.aria}}" aria-pressed="{{z.pressed}}" onClick="{{z.pick}}" style="{{z.style}}">{{z.label}}</button>
    </sc-for>
  </div>

  <div style="position: absolute; left: 668px; top: 24px; bottom: 24px; width: 90px; display: flex; flex-direction: column; justify-content: space-between; align-items: center">
    <button aria-label="Сменить камеру" style="width: 58px; height: 58px; flex: none; border: 0; padding: 0; border-radius: 18px; background: #1C1C1E; box-shadow: inset 0 0 0 0.5px rgba(255,255,255,.1); color: #FFFFFF; display: flex; align-items: center; justify-content: center; cursor: pointer">
      <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19.5 10.5a7.8 7.8 0 0 0-14.2-3 M4.5 13.5a7.8 7.8 0 0 0 14.2 3 M5 3.5V7.8h4.3 M19 20.5v-4.3h-4.3"/></svg>
    </button>
    <button aria-label="Снять" style="width: 86px; height: 86px; border-radius: 43px; border: 0; padding: 0; background: #3A3A3C; display: flex; align-items: center; justify-content: center; cursor: pointer">
      <span style="width: 70px; height: 70px; border-radius: 35px; background: #FFFFFF"></span>
    </button>
    <button aria-label="Галерея" style="width: 58px; height: 58px; flex: none; border: 0; padding: 0; border-radius: 18px; background: linear-gradient(160deg, #6C7A8C, #2B333D); box-shadow: inset 0 0 0 1.5px rgba(255,255,255,.22); cursor: pointer"></button>
  </div>

  <div style="position: absolute; left: 770px; top: 24px; bottom: 24px; width: 58px; display: flex; flex-direction: column; justify-content: space-between; align-items: center">
    <button onClick="{{togglePro}}" aria-label="Ручной режим" aria-pressed="{{proPressed}}" style="{{proBtn}}">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7h9 M17 7h3 M15 5v4 M4 17h3 M11 17h9 M9 15v4"/></svg>
    </button>
    <div role="radiogroup" aria-label="Режим съёмки" style="width: 52px; box-sizing: border-box; padding: 4px; border-radius: 26px; background: #1C1C1E; box-shadow: inset 0 0 0 0.5px rgba(255,255,255,.1); display: flex; flex-direction: column; align-items: center; gap: 10px">
      <sc-for list="{{modes}}" as="m" hint-placeholder-count="2">
        <button role="radio" aria-checked="{{m.checked}}" aria-label="{{m.label}}" onClick="{{m.pick}}" style="{{m.style}}">
          <svg width="23" height="23" viewBox="0 0 24 24" fill="{{m.fill}}" fill-rule="evenodd" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{m.d}}"/></svg>
        </button>
      </sc-for>
    </div>
    <a href="Hybrid.dc.html" aria-label="Настройки" style="width: 50px; height: 50px; flex: none; border-radius: 16px; background: #1C1C1E; box-shadow: inset 0 0 0 0.5px rgba(255,255,255,.1); color: #FFFFFF; display: flex; align-items: center; justify-content: center">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 4a8 8 0 1 0 0 16a8 8 0 1 0 0-16z M12 9.8a2.2 2.2 0 1 0 0 4.4a2.2 2.2 0 1 0 0-4.4z M12 9.8V4 M13.9 13.1l5 2.9 M10.1 13.1l-5 2.9"/></svg>
    </a>
  </div>

  <button aria-label="Быстрые настройки (свайп от края)" style="position: absolute; right: 3px; top: 50%; margin-top: -22px; width: 10px; height: 44px; border: 0; padding: 0; background: transparent; cursor: pointer; display: flex; align-items: center; justify-content: center">
    <span style="width: 4px; height: 36px; border-radius: 2px; background: rgba(255,255,255,.35)"></span>
  </button>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":844,"height":390}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { mode: 'photo', zoom: '1', pro: false, on: { torch: false, timer: false, lut: false, dcg: true } }; }
  renderVals() {
    const st = this.state, YEL = '#FFD60A';
    const D = [
      ['format', 'Формат и размер', null, 'JPEG', '12,6 Мп'],
      ['torch', 'Фонарик', 'M13.2 2.8L5.5 13.4h5.7l-1 7.8 7.8-10.6h-5.8z'],
      ['timer', 'Таймер', 'M12 6.5a7.3 7.3 0 1 0 0 14.6a7.3 7.3 0 1 0 0-14.6z M12 14V10.5 M9.5 2.8h5 M12 2.8v3.7'],
      ['lut', 'LUT и плёнка', 'M6 4h12a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2z M20 4L4 20'],
      ['dcg', 'DCG', null, 'DCG', '']
    ];
    // the portrait's top-bar buttons, in a column
    const side = D.map(([id, name, d, text, sub]) => {
      const on = !!st.on[id];
      return { name, d, text, sub, isText: !d, isIcon: !!d, pressed: on ? 'true' : 'false', fill: on && id === 'torch' ? YEL : 'none',
        flip: () => { if (id !== 'format') this.setState({ on: { ...st.on, [id]: !on } }); },
        style: 'height: 40px; min-width: 40px; padding: 0 4px; border: 0; border-radius: 20px; display: flex; align-items: center; justify-content: center; cursor: pointer; font: inherit; transition: background .25s; '
          + (on ? 'background: rgba(255,214,10,.16); color: ' + YEL : 'background: transparent; color: #FFFFFF') };
    });
    // the portrait's zoom capsule, upright (the longest focal length on top)
    const zooms = [['3.7', '3,7', '3,7×'], ['2', '2', '2×'], ['1', '1', '1×'], ['0.6', '0,6', '0,6']].map(([id, off, on1]) => {
      const on = st.zoom === id;
      return { label: on ? on1 : off, aria: 'Зум ' + off, pressed: on ? 'true' : 'false', pick: () => this.setState({ zoom: id }),
        style: 'width: 44px; height: 48px; border: 0; padding: 0; border-radius: 22px; cursor: pointer; font: inherit; font-weight: 600; transition: all .25s; '
          + (on ? 'font-size: 15px; background: #3A3A3C; color: ' + YEL : 'font-size: 14px; background: transparent; color: #FFFFFF') };
    });
    const I = {
      run: 'M14 6a1.6 1.6 0 1 0 0-3.2a1.6 1.6 0 1 0 0 3.2z M7 11.5l3-3.5 4.2 1.2 2.3 3.3 2.7.8 M12.6 9l-1.8 6.5 3.2 2.5V22 M10.8 15.5L8 21',
      photo: 'M4 8.5h3l1.6-2.2h6.8L17 8.5h3a1.5 1.5 0 0 1 1.5 1.5v8A1.5 1.5 0 0 1 20 19.5H4A1.5 1.5 0 0 1 2.5 18v-8A1.5 1.5 0 0 1 4 8.5z M12 10.4a3.4 3.4 0 1 0 0 6.8a3.4 3.4 0 1 0 0-6.8z'
    };
    // the portrait's mode capsule, upright: Спорт above Фото (the portrait's left is the landscape's bottom)
    const modes = [['sport', 'Спорт', I.run], ['photo', 'Фото', I.photo]].map(([id, label, d]) => {
      const on = st.mode === id;
      return { label, d, fill: on && id === 'photo' ? 'currentColor' : 'none', checked: on ? 'true' : 'false', pick: () => this.setState({ mode: id }),
        style: 'width: 44px; height: 44px; flex: none; border: 0; padding: 0; border-radius: 22px; display: flex; align-items: center; justify-content: center; cursor: pointer; transition: background .3s, color .25s; '
          + (on ? 'background: #3A3A3C; color: ' + YEL : 'background: transparent; color: #FFFFFF') };
    });
    return { side, zooms, modes, proPressed: st.pro ? 'true' : 'false',
      togglePro: () => this.setState({ pro: !st.pro }),
      proBtn: 'width: 50px; height: 50px; flex: none; border: 0; padding: 0; border-radius: 16px; display: flex; align-items: center; justify-content: center; cursor: pointer; transition: background .25s, color .25s; '
        + (st.pro ? 'background: #4A3D00; color: ' + YEL + '; box-shadow: inset 0 0 0 1.5px ' + YEL : 'background: #1C1C1E; color: #FFFFFF; box-shadow: inset 0 0 0 0.5px rgba(255,255,255,.1)') };
  }
}
</script>
</body>
</html>
