<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Камеры и модули</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Roboto+Flex:opsz,wght@8..144,400;8..144,500;8..144,600;8..144,700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#1C1C1E}
*{-webkit-tap-highlight-color:transparent}
button:focus{outline:none}
.rowbtn:active{background:rgba(255,255,255,.07)}
@keyframes rise{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@keyframes iosKnobA{0%{transform:scale(1)}30%{transform:scale(1.2,.84)}60%{transform:scale(.94,1.07)}100%{transform:scale(1)}}
@keyframes iosKnobB{0%{transform:scale(1)}30%{transform:scale(1.2,.84)}60%{transform:scale(.94,1.07)}100%{transform:scale(1)}}
@keyframes iosPopA{0%{transform:scale(1)}35%{transform:scale(1.22)}100%{transform:scale(1)}}
@keyframes iosPopB{0%{transform:scale(1)}35%{transform:scale(1.22)}100%{transform:scale(1)}}
@keyframes iosMenuIn{0%{transform:scale(.25);opacity:0;filter:blur(6px)}60%{opacity:1;filter:blur(0)}100%{transform:scale(1);opacity:1}}
@keyframes iosMenuOut{to{transform:scale(.6);opacity:0;filter:blur(4px)}}
@keyframes iosFade{from{opacity:0}to{opacity:1}}
@keyframes iosAlertIn{0%{transform:scale(1.15);opacity:0}100%{transform:scale(1);opacity:1}}
@keyframes iosHud{0%{transform:translate(-50%,-30px) scale(.8);opacity:0}100%{transform:translate(-50%,0) scale(1);opacity:1}}
@keyframes iosFlash{0%,100%{background:#1C1C1E}25%,60%{background:#3A3A3C}}

</style>
</helmet>
<div style="position: relative; width: 390px; min-height: 844px; box-sizing: border-box; padding: 0 16px 40px; font-family: 'Roboto Flex', -apple-system, system-ui, sans-serif; background: #1C1C1E; color: #FFFFFF; -webkit-font-smoothing: antialiased">

  </div>
  <div style="margin: 14px 4px 12px; font-size: 34px; line-height: 1.12; font-weight: 700; letter-spacing: -0.4px">Камеры и модули</div>

  <div style="padding: 20px 16px 4px; font-size: 12px; font-weight: 600; letter-spacing: 1px; color: rgba(255,255,255,.55)">МОДУЛИ КАМЕРЫ</div>

              </button>
            </sc-for>
          </div>
        </sc-if>
      </div>
    </sc-for>
  </div>
  <div style="margin-top: 14px; border-radius: 24px; background: #2C2C2E; overflow: hidden">

  </sc-if>
</div>
</x-dc>

        toggle: () => set({ open: open ? null : id }),
        subStyle: 'font-size: 13px; line-height: 17px; color: ' + (active ? A : 'rgba(255,255,255,.55)'),
        chev: 'flex: none; transition: transform .25s cubic-bezier(.2,.8,.2,1); transform: rotate(' + (open ? 90 : 0) + 'deg)',
        badge: 'width: 40px; height: 40px; flex: none; border-radius: 20px; display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 700; font-variant-numeric: tabular-nums; '
          + (active ? 'background: ' + mix('#2C2C2E', A, .28) + '; color: ' + A + '; box-shadow: inset 0 0 0 1.5px ' + A : 'background: #3A3A3C; color: #FFFFFF') };
    });
    const extra = [
      { title: 'Добавить кнопку с кропом', sub: 'Копия объектива со своим кропом — например, 1,3× от 1×', d: D.plus, tile: 'width: 32px; height: 32px; flex: none; border-radius: 9px; display: flex; align-items: center; justify-content: center; background: ' + mix('#2C2C2E', A, .28) + '; color: ' + A, sep: false, tap: () => toast('Новая кнопка с кропом') },
      { title: 'Свои настройки для каждого модуля', sub: 'Стиль и обработка запоминаются отдельно', d: D.sliders, tile: tile('indigo', 32, 9), sep: true, tap: () => toast('Открыто') },
      { title: 'Копировать настройки между модулями', sub: 'Перенести стиль и обработку с одного на другой', d: D.copy, tile: tile('blue', 32, 9), sep: true, tap: () => toast('Открыто') }];
    return {
      acc: A, chip: activeName[1] + ' · ' + activeName[3].replace(/.*ID /, 'ID '),
      chipStyle: 'display: inline-flex; align-items: center; gap: 8px; height: 40px; padding: 0 14px 0 16px; border: 0; border-radius: 20px; background: #2C2C2E; color: #FFFFFF; font: inherit; font-size: 15px; font-weight: 600; cursor: pointer',
      pickChip: () => { const ids = MODS.map((m) => m[0]); const n = ids[(ids.indexOf(st.active) + 1) % ids.length]; set({ active: n, open: n }); toast('Настраивается: ' + MODS.find((m) => m[0] === n)[1]); },
      mods, extra,
      themes: THEMES.map(([name, c], i) => ({ name, on: st.acc === i ? 'true' : 'false', pick: () => set({ acc: i }),
        style: 'width: 34px; height: 34px; border-radius: 17px; border: 0; padding: 0; cursor: pointer; background: ' + c + '; transition: transform .3s cubic-bezier(.34,1.56,.64,1); '
          + (st.acc === i ? 'transform: scale(1.12); box-shadow: 0 0 0 3px #1C1C1E, 0 0 0 5px ' + c : '') })),
      hasToast: !!st.toast, toast: st.toast || ''
    };
  }
}
</script>
</body>
