<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Редактор числа</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Roboto+Flex:opsz,wght@8..144,400;8..144,500;8..144,600;8..144,700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#1C1C1E}
*{-webkit-tap-highlight-color:transparent}
button:focus{outline:none}
button:focus-visible{outline:2px solid #FFD60A;outline-offset:2px}
.cap:active{transform:scale(.96)}
@keyframes sheetIn{from{transform:translateY(100%)}to{transform:none}}
@keyframes dimIn{from{opacity:0}to{opacity:1}}
@keyframes numPop{0%{transform:scale(1)}35%{transform:scale(1.12)}100%{transform:scale(1)}}
@keyframes numPop2{0%{transform:scale(1)}35%{transform:scale(1.12)}100%{transform:scale(1)}}
@keyframes iosKnobA{0%{transform:scale(1)}30%{transform:scale(1.2,.84)}60%{transform:scale(.94,1.07)}100%{transform:scale(1)}}
@keyframes iosKnobB{0%{transform:scale(1)}30%{transform:scale(1.2,.84)}60%{transform:scale(.94,1.07)}100%{transform:scale(1)}}
@keyframes iosPopA{0%{transform:scale(1)}35%{transform:scale(1.22)}100%{transform:scale(1)}}
@keyframes iosPopB{0%{transform:scale(1)}35%{transform:scale(1.22)}100%{transform:scale(1)}}
@keyframes iosMenuIn{0%{transform:scale(.25);opacity:0;filter:blur(6px)}60%{opacity:1;filter:blur(0)}100%{transform:scale(1);opacity:1}}
@keyframes iosMenuOut{to{transform:scale(.6);opacity:0;filter:blur(4px)}}
@keyframes iosFade{from{opacity:0}to{opacity:1}}
@keyframes iosAlertIn{0%{transform:scale(1.15);opacity:0}100%{transform:scale(1);opacity:1}}
@keyframes iosHud{0%{transform:translate(-50%,-30px) scale(.8);opacity:0}100%{transform:translate(-50%,0) scale(1);opacity:1}}
@keyframes iosFlash{0%,100%{background:#1C1C1E}25%,60%{background:#3A3A3C}}

</style>
</helmet>
<div style="position: relative; width: 390px; height: 844px; overflow: hidden; font-family: 'Roboto Flex', -apple-system, system-ui, sans-serif; background: #1C1C1E; color: #FFFFFF; -webkit-font-smoothing: antialiased">
  <div style="padding: 16px 16px 0">
    <div style="display: flex; align-items: center; gap: 8px; height: 44px">
      <span style="width: 40px; height: 40px; border-radius: 20px; background: #2C2C2E; display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg></span>
      <span style="flex: 1; text-align: center; font-size: 13px; color: rgba(255,255,255,.55)">Настройки › Склейка</span>
      <span style="width: 40px"></span>
    </div>
    <div style="margin: 14px 4px 12px; font-size: 34px; font-weight: 700; letter-spacing: -0.4px">Склейка</div>
    <div style="padding: 6px 16px 8px; font-size: 12px; font-weight: 600; letter-spacing: 1px; color: rgba(255,255,255,.55)">КАДРЫ СЕРИИ</div>
    <sc-for list="{{rows}}" as="r" hint-placeholder-count="3">
      <button onClick="{{r.open}}" style="{{r.style}}">
        <span style="width: 32px; height: 32px; border-radius: 9px; background: #6E238D; color: #E9B3FF; display: flex; align-items: center; justify-content: center; flex: none"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 7.5h12a2 2 0 0 1 2 2V18a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V9.5a2 2 0 0 1 2-2z M8 4.5h8"/></svg></span>
        <span style="flex: 1; min-width: 0; text-align: left; display: flex; flex-direction: column; gap: 2px">
          <span style="font-size: 16px; font-weight: 600">{{r.title}}</span>
          <span style="font-size: 13px; color: rgba(255,255,255,.6)">{{r.sub}}</span>
        </span>
        <span style="{{r.pill}}">{{r.value}}</span>
      </button>
    </sc-for>
    <div style="padding: 10px 16px; font-size: 13px; line-height: 18px; color: rgba(255,255,255,.55)">Нажмите на строку — откроется редактор числа.</div>
    <div style="padding: 6px 16px 8px; font-size: 12px; font-weight: 600; letter-spacing: 1px; color: rgba(255,255,255,.55)">ТЕМА ТЕЛЕФОНА (ДЛЯ ПРИМЕРА)</div>
    <div style="display: flex; gap: 10px; padding: 0 16px">
      <sc-for list="{{themes}}" as="th" hint-placeholder-count="5">
        <button onClick="{{th.pick}}" aria-label="{{th.name}}" aria-pressed="{{th.on}}" style="{{th.style}}"></button>
      </sc-for>
    </div>
  </div>

  <sc-if value="{{open}}" hint-placeholder-val="{{ true }}">
    <button aria-label="Закрыть" onClick="{{close}}" style="position: absolute; inset: 0; border: 0; padding: 0; background: rgba(0,0,0,.45); cursor: pointer; animation: dimIn .25s"></button>
    <div role="dialog" aria-label="{{title}}" style="position: absolute; left: 8px; right: 8px; bottom: 8px; box-sizing: border-box; padding: 6px 0 18px; border-radius: 34px; background: #1C1C1E; box-shadow: inset 0 0 0 .5px rgba(255,255,255,.12), 0 -12px 30px rgba(0,0,0,.5); display: flex; flex-direction: column; animation: sheetIn .45s cubic-bezier(.32,.72,0,1)">
      <span style="align-self: center; width: 36px; height: 5px; border-radius: 3px; background: rgba(255,255,255,.22)"></span>
      <div style="display: flex; align-items: center; height: 48px; padding: 0 8px">
        <button onClick="{{close}}" style="{{cancelStyle}}">Отмена</button>
        <span style="flex: 1; min-width: 0; text-align: center; font-size: 17px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{title}}</span>
        <button onClick="{{apply}}" style="{{doneStyle}}">Готово</button>
      </div>
      <div style="display: flex; flex-direction: column; align-items: center; padding: 18px 0 6px">
        <span style="{{numStyle}}">{{value}}</span>
        <button onClick="{{reset}}" style="{{resetStyle}}">{{resetLabel}}</button>
      </div>
      <div style="display: flex; align-items: center; gap: 10px; padding: 8px 20px 4px">
        <span style="font-size: 12px; color: rgba(255,255,255,.4); min-width: 22px; text-align: right">{{min}}</span>
        <div onPointerDown="{{sl.down}}" onPointerMove="{{sl.move}}" onPointerUp="{{sl.up}}" onPointerCancel="{{sl.cancel}}" onDoubleClick="{{sl.reset}}" style="{{slWrap}}">
          <div style="{{sl.track}}"><div style="{{sl.fill}}"></div></div>
          <div style="{{sl.knob}}"></div>
        </div>
        <span style="font-size: 12px; color: rgba(255,255,255,.4); min-width: 22px">{{max}}</span>
      </div>
      <div style="margin: 14px 16px 0; border-radius: 24px; background: #2C2C2E; overflow: hidden">
        <div style="display: flex; align-items: center; gap: 12px; min-height: 52px; padding: 0 12px 0 16px">
          <span style="flex: 1; font-size: 16px">Точно</span>
          <div style="display: flex; height: 34px; border-radius: 17px; background: rgba(118,118,128,.24); overflow: hidden">
            <button class="cap" onClick="{{minus}}" aria-label="Меньше на 1" style="width: 48px; border: 0; background: transparent; color: #FFFFFF; font: inherit; font-size: 22px; cursor: pointer">−</button>
            <span style="width: .5px; margin: 8px 0; background: rgba(255,255,255,.25)"></span>
            <button class="cap" onClick="{{plus}}" aria-label="Больше на 1" style="width: 48px; border: 0; background: transparent; color: #FFFFFF; font: inherit; font-size: 22px; cursor: pointer">+</button>
          </div>
        </div>
        <button onClick="{{pin}}" style="display: flex; align-items: center; gap: 12px; width: 100%; min-height: 52px; padding: 0 12px 0 16px; border: 0; background: transparent; box-shadow: inset 0 .5px 0 rgba(84,84,88,.65); color: inherit; font: inherit; text-align: left; cursor: pointer">
          <span style="flex: 1; font-size: 16px">Плитка в шторке</span>
          <span role="switch" aria-checked="{{pinned}}" style="{{sw.track}}"><span style="{{sw.knob}}"></span></span>
        </button>
      </div>
    </div>
  </sc-if>
  <sc-if value="{{hasToast}}" hint-placeholder-val="{{ false }}">
    <div style="position: absolute; left: 50%; top: 12px; transform: translateX(-50%); z-index: 9; padding: 10px 18px; border-radius: 20px; background: rgba(20,20,22,.92); box-shadow: inset 0 0 0 .5px rgba(255,255,255,.15); font-size: 14px; font-weight: 600; white-space: nowrap; animation: iosHud .45s cubic-bezier(.34,1.5,.64,1)">{{toast}}</div>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { acc: 0, vals: { zsl: 50, frames: 20, f50: 12 }, open: 'zsl', draft: 50, pinned: false, drag: null, bump: {}, pop: 0, toast: null };
  }
  /* <ios-kit> shared iOS controls of the concept (the same code in every artboard) */
  // slider: drag anywhere (relative, no jump), tap jumps, double tap resets; rubber band past the ends, glass knob while held, spring on release
  iosSlider(id, k, onK, o) {
    o = o || {};
    const st = this.state, ACC = o.acc || '#0A84FF', SPR = 'cubic-bezier(.34,1.56,.64,1)';
    const clamp = (x) => Math.max(0, Math.min(1, x));
    const d = st.drag && st.drag.id === id ? st.drag : null;
    const n = (st.bump && st.bump[id]) || 0;
    const pos = 'calc(14px + ' + clamp(k).toFixed(4) + ' * (100% - 28px))', over = d ? d.over : 0, live = !!(d && d.moving);
    const w = (this._sl && this._sl.id === id && this._sl.w) || 300;
    const bump = () => { const b = { ...(this.state.bump || {}) }; b[id] = (b[id] || 0) + 1; this.setState({ drag: null, bump: b });
      clearTimeout(this['_b' + id]); this['_b' + id] = setTimeout(() => { const c = { ...(this.state.bump || {}) }; delete c[id]; this.setState({ bump: c }); }, 700); };
    const end = (e, cancel) => { const s = this._sl; if (!s || s.id !== id) return; this._sl = null;
      if (!cancel && !s.moved && e && e.clientX != null) onK(clamp((e.clientX - s.r.left - 14) / Math.max(1, s.r.width - 28)));
      bump(); };
    const anim = (a, b) => n ? '; animation: ' + (n % 2 ? a : b) + ' .55s ' + SPR : '';
    return {
      down: (e) => { const el = e.currentTarget, r = el.getBoundingClientRect(); try { el.setPointerCapture(e.pointerId); } catch (x) { /* old browsers */ }
        this._sl = { id, r, w: Math.max(1, (r.width || 300) - 28), x0: e.clientX, k0: clamp(k), moved: false }; this.setState({ drag: { id, over: 0, moving: false } }); },
      move: (e) => { const s = this._sl; if (!s || s.id !== id) return; const dx = e.clientX - s.x0;
        if (!s.moved && Math.abs(dx) < 4) return; s.moved = true;
        const raw = s.k0 + dx / s.w, ex = raw < 0 ? raw * s.w : raw > 1 ? (raw - 1) * s.w : 0;
        onK(clamp(raw)); this.setState({ drag: { id, over: Math.sign(ex) * 20 * (1 - Math.exp(-Math.abs(ex) / 70)), moving: true } }); },
      up: (e) => end(e, false), cancel: (e) => end(e, true),
      reset: () => { if (o.def != null) { onK(o.def); bump(); } },
      key: (e) => { onK(clamp(Number(e.target.value) / 1000)); },
      k1000: Math.round(clamp(k) * 1000),
      wrap: 'position: relative; height: 38px; touch-action: pan-y; cursor: pointer; user-select: none; -webkit-user-select: none',
      track: 'position: absolute; left: 0; right: 0; top: 50%; height: ' + (d ? 9 : 6) + 'px; margin-top: ' + (d ? -4.5 : -3) + 'px; border-radius: 5px; overflow: hidden; background: rgba(120,120,128,.36); transform-origin: '
        + (over < 0 ? 'right' : 'left') + '; transform: ' + (over ? 'scaleX(' + (1 + Math.abs(over) / w).toFixed(4) + ')' : 'none')
        + '; transition: ' + (live ? 'height .25s ' + SPR + ', margin .25s ' + SPR : 'transform .6s ' + SPR + ', height .35s ' + SPR + ', margin .35s ' + SPR),
      fill: 'height: 100%; width: ' + pos + '; background: ' + ACC + '; transition: width ' + (live ? '.05s linear' : '.5s ' + SPR),
      knob: 'position: absolute; top: 50%; left: ' + pos + '; width: ' + (d ? 42 : 28) + 'px; height: ' + (d ? 26 : 28) + 'px; margin: ' + (d ? '-13px 0 0 -21px' : '-14px 0 0 -14px')
        + '; border-radius: 14px; pointer-events: none; translate: ' + (over * .9).toFixed(1) + 'px 0; '
        + (d ? 'background: rgba(255,255,255,.18); -webkit-backdrop-filter: blur(2px) saturate(2); backdrop-filter: blur(2px) saturate(2); box-shadow: inset 0 0 0 1.5px rgba(255,255,255,.9), inset 0 -6px 10px rgba(255,255,255,.25), 0 8px 20px rgba(0,0,0,.35)'
          : 'background: #FFFFFF; box-shadow: 0 2px 8px rgba(0,0,0,.35), 0 0 0 .5px rgba(0,0,0,.05)')
        + '; transition: left ' + (live ? '.05s linear' : '.5s ' + SPR) + ', translate ' + (live ? '.05s linear' : '.6s ' + SPR) + ', width .4s ' + SPR + ', height .4s ' + SPR + ', margin .4s ' + SPR + ', background .25s, box-shadow .25s'
        + (d ? '' : anim('iosKnobA', 'iosKnobB')),
      value: (base) => base + '; display: inline-block; transform-origin: right center; transition: transform .45s ' + SPR + ', color .2s; transform: scale(' + (d ? 1.16 : 1) + ')'
        + (d ? '; color: ' + ACC : '') + (d ? '' : anim('iosPopA', 'iosPopB'))
    };
  }
  // segmented control with a sliding thumb
  iosSeg(items, cur, pick, o) {
    o = o || {};
    const k = items.length, i = Math.max(0, items.findIndex((x) => x[1] === cur)), SPR = 'cubic-bezier(.34,1.4,.64,1)';
    return {
      track: 'position: relative; display: grid; grid-template-columns: repeat(' + k + ', minmax(0, 1fr)); padding: 3px; border-radius: 20px; background: rgba(118,118,128,.24)' + (o.margin ? '; margin: ' + o.margin : ''),
      thumb: 'position: absolute; top: 3px; bottom: 3px; left: calc(3px + ' + i + ' * (100% - 6px) / ' + k + '); width: calc((100% - 6px) / ' + k + '); border-radius: 17px; background: ' + (o.thumb || '#636366')
        + '; box-shadow: 0 3px 8px rgba(0,0,0,.25), 0 0 0 .5px rgba(0,0,0,.04); transition: left .45s ' + SPR + '; pointer-events: none',
      segs: items.map(([label, v]) => ({ label, on: v === cur ? 'true' : 'false', pick: () => pick(v),
        style: 'position: relative; min-height: 34px; padding: 4px 6px; border: 0; background: transparent; cursor: pointer; font: inherit; font-size: 13px; line-height: 16px; font-weight: 600; transition: color .2s; color: '
          + (v === cur ? (o.onInk || '#FFFFFF') : 'rgba(235,235,245,.75)') }))
    };
  }
  // switch
  iosSwitch(on, o) {
    o = o || {};
    const SPR = 'cubic-bezier(.34,1.5,.64,1)';
    return {
      track: 'position: relative; width: 51px; height: 31px; flex: none; border-radius: 16px; transition: background .3s; background: ' + (on ? (o.acc || '#30D158') : 'rgba(120,120,128,.32)'),
      knob: 'position: absolute; top: 2px; left: ' + (on ? 22 : 2) + 'px; width: 27px; height: 27px; border-radius: 14px; background: #FFFFFF; box-shadow: 0 3px 8px rgba(0,0,0,.15), 0 3px 1px rgba(0,0,0,.06); transition: left .4s ' + SPR
    };
  }
  /* </ios-kit> */

  renderVals() {
    const st = this.state, set = (p) => this.setState(p);
    const ROWS = { zsl: ['Кадров в буфере ZSL', 'Сколько кадров камера держит до нажатия', 1, 100, 50],
      frames: ['Кадров в склейке', 'Сколько кадров склеивать', 4, 65, 20], f50: ['Кадров в снимке 50 Мп', 'FULLRES 50 Мп; 0 — как «Кадров в склейке»', 0, 65, 12] };
    // the accent follows the phone's theme (AccentPalette.camera: the system's Material You colour, else the camera yellow)
    const THEMES = [['Жёлтая (по умолчанию)', '#FFD60A'], ['Синяя', '#9ECAFF'], ['Зелёная', '#9BD49C'], ['Лавандовая', '#C7B5FF'], ['Розовая', '#FFB1C8']];
    const A = THEMES[st.acc][1];
    const hex = (c) => [1, 3, 5].map((i) => parseInt(c.substr(i, 2), 16));
    const mix = (a, b, k) => { const x = hex(a), y = hex(b); return '#' + x.map((v, i) => Math.round(v + (y[i] - v) * k).toString(16).padStart(2, '0')).join(''); };
    const toast = (t) => { set({ toast: t }); clearTimeout(this._t); this._t = setTimeout(() => this.setState({ toast: null }), 1600); };
    const keys = Object.keys(ROWS);
    const rows = keys.map((k, i) => ({ title: ROWS[k][0], sub: ROWS[k][1], value: String(st.vals[k]),
      pill: 'height: 30px; padding: 0 12px; border-radius: 15px; background: ' + mix('#1C1C1E', A, .28) + '; color: ' + A + '; font-size: 15px; font-weight: 700; display: flex; align-items: center',
      open: () => set({ open: k, draft: st.vals[k] }),
      style: 'display: flex; align-items: center; gap: 12px; width: 100%; min-height: 60px; padding: 9px 16px; box-sizing: border-box; border: 0; background: #2C2C2E; color: inherit; font: inherit; cursor: pointer; border-radius: '
        + (i === 0 ? '24px 24px 0 0' : i === keys.length - 1 ? '0 0 24px 24px' : '0') + (i ? '; box-shadow: inset 0 .5px 0 rgba(84,84,88,.65)' : '') }));
    const k = st.open || 'zsl', R = ROWS[k], min = R[2], max = R[3], def = R[4];
    const clamp = (v) => Math.max(min, Math.min(max, Math.round(v)));
    const bump = (v) => set({ draft: clamp(v), pop: st.pop + 1 });
    const sl = this.iosSlider('num' + k, (st.draft - min) / (max - min), (kk) => this.setState({ draft: clamp(min + kk * (max - min)) }), { acc: A, def: (def - min) / (max - min) });
    const tracking = st.drag && st.drag.id === 'num' + k;
    if (this._wasTracking && !tracking) { this._wasTracking = false; setTimeout(() => this.setState({ pop: this.state.pop + 1 }), 0); }
    if (tracking) this._wasTracking = true;
    return {
      rows, open: !!st.open, title: R[0], value: String(st.draft), min: String(min), max: String(max),
      numStyle: 'font-size: 64px; line-height: 70px; font-weight: 700; color: ' + (tracking ? A : '#FFFFFF') + '; font-variant-numeric: tabular-nums; display: inline-block; transition: color .2s, transform .35s cubic-bezier(.34,1.56,.64,1); transform: scale(' + (tracking ? 1.08 : 1) + ')'
        + (tracking ? '' : '; animation: ' + (st.pop % 2 ? 'numPop' : 'numPop2') + ' .45s cubic-bezier(.34,1.56,.64,1)'),
      resetLabel: st.draft === def ? 'По умолчанию' : 'Сбросить до ' + def,
      resetStyle: 'margin-top: 2px; height: 30px; padding: 0 12px; border: 0; border-radius: 15px; background: transparent; font: inherit; font-size: 14px; cursor: pointer; transition: color .2s; color: ' + (st.draft === def ? 'rgba(255,255,255,.35)' : A),
      reset: () => bump(def), sl, slWrap: 'flex: 1; ' + sl.wrap,
      minus: () => bump(st.draft - 1), plus: () => bump(st.draft + 1),
      pinned: st.pinned ? 'true' : 'false',
      // 40 % further to the approved concept's switch (green, no outline, a big white knob): the lime between the accent and green
      sw: { track: 'position: relative; width: 51px; height: 31px; flex: none; box-sizing: border-box; border-radius: 16px; transition: background .25s, border-color .25s; border: .6px solid '
          + (st.pinned ? A : 'rgba(255,255,255,.13)') + '; background: ' + (st.pinned ? A : '#39393C'),
        knob: 'position: absolute; top: 50%; transform: translateY(-50%); border-radius: 50%; transition: all .35s cubic-bezier(.34,1.4,.64,1); box-shadow: 0 2px 6px rgba(0,0,0,.3); '
          + (st.pinned ? 'left: 22px; width: 26.5px; height: 26.5px; background: ' + mix('#FFFFFF', A, .18) : 'left: 2.5px; width: 24px; height: 24px; background: rgba(255,255,255,.88)') },
      pin: () => { set({ pinned: !st.pinned }); toast(st.pinned ? 'Убрано из шторки' : 'Добавлено в шторку'); },
      apply: () => { const v = st.draft; set({ vals: { ...st.vals, [k]: v }, open: null }); toast(R[0] + ': ' + v); },
      close: () => set({ open: null }),
      cancelStyle: 'height: 44px; padding: 0 12px; border: 0; background: transparent; color: ' + A + '; font: inherit; font-size: 17px; cursor: pointer',
      doneStyle: 'height: 44px; padding: 0 12px; border: 0; background: transparent; color: ' + A + '; font: inherit; font-size: 17px; font-weight: 700; cursor: pointer',
      themes: THEMES.map(([name, c], i) => ({ name, on: st.acc === i ? 'true' : 'false', pick: () => set({ acc: i }),
        style: 'width: 34px; height: 34px; border-radius: 17px; border: 0; padding: 0; cursor: pointer; background: ' + c + '; transition: transform .3s cubic-bezier(.34,1.56,.64,1), box-shadow .2s; '
          + (st.acc === i ? 'transform: scale(1.12); box-shadow: 0 0 0 3px #1C1C1E, 0 0 0 5px ' + c : 'transform: scale(1)') })),
      hasToast: !!st.toast, toast: st.toast || ''
    };
  }
}
</script>
</body>
</html>
