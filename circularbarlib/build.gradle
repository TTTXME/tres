// The manual-controls panel (ISO, shutter, EV, focus, white balance) used by the camera screen: an Android library the app
// links in (project ':circularbarlib'), Java 8 sources, the same SDK levels as the app.
plugins {
    id 'com.android.library'
    id 'kotlin-android'
    id 'jacoco'
}

def panelJava = JavaVersion.VERSION_1_8

android {
    namespace = 'com.scamera.app.circularbarlib'
    compileSdk = 36
    defaultConfig {
        minSdk = 26
        //noinspection OldTargetApi
        targetSdk = 35
        testInstrumentationRunner = 'androidx.test.runner.AndroidJUnitRunner'
        // rules the app's R8 takes from the library (none so far: the app's own keep what it reaches by name)
        consumerProguardFiles 'consumer-rules.pro'
    }
    compileOptions {
        sourceCompatibility = panelJava
        targetCompatibility = panelJava
    }
    // a release build of the library alone is shrunk with its own rules
    buildTypes.release {
        minifyEnabled = true
        proguardFiles(getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro')
    }
}

repositories {
    mavenCentral()
}

dependencies {
    [
            'androidx.core:core-ktx:1.9.0',
            "org.jetbrains.kotlin:kotlin-stdlib-jdk7:$kotlin_version",
    ].each { implementation it }
    ['junit:junit:4.13.1', 'org.testng:testng:7.1.0'].each { testImplementation it }
    ['junit:junit:4.13.1', 'androidx.test.ext:junit:1.1.5', 'androidx.test:monitor:1.6.1'].each { androidTestImplementation it }
}
