apply plugin: 'com.android.application'
apply plugin: 'kotlin-android'
apply from: rootProject.file('gradle/verify-apk.gradle')
// P214b: scameraBuildIdentity (git SHA, dirty, CI/local) for the BuildConfig fields below
apply from: rootProject.file('gradle/build-identity.gradle')
Properties versionProps = new Properties()
// The SCAMERA release key is never in the repository: CI passes it in the environment, a local build
// reads SCAMERA-PC/signing/signing.properties next to the project (key/README.md). Without either the build is signed
// with the local Android debug key.
Properties scameraSigning = new Properties()
def signingFile = rootProject.file('../signing/signing.properties')
if (System.getenv('SCAMERA_KEYSTORE') != null) {
    scameraSigning.setProperty('storeFile', System.getenv('SCAMERA_KEYSTORE'))
    scameraSigning.setProperty('storePassword', System.getenv('SCAMERA_KEYSTORE_PASSWORD') ?: '')
    scameraSigning.setProperty('keyPassword', System.getenv('SCAMERA_KEYSTORE_PASSWORD') ?: '')
    scameraSigning.setProperty('keyAlias', System.getenv('SCAMERA_KEY_ALIAS') ?: 'scamera')
} else if (signingFile.canRead()) {
    signingFile.withInputStream { scameraSigning.load(it) }
    scameraSigning.setProperty('storeFile', new File(signingFile.parentFile, scameraSigning.getProperty('storeFile')).path)
}
android {
    signingConfigs {
        debug {
            if (scameraSigning.getProperty('storeFile') != null) {
                storeFile file(scameraSigning.getProperty('storeFile'))
                storePassword scameraSigning.getProperty('storePassword')
                keyPassword scameraSigning.getProperty('keyPassword')
                keyAlias scameraSigning.getProperty('keyAlias')
            }
        }
    }
    // version.properties: the local build number (VERSION_BUILD), bumped by every assemble; CI's SCAMERA_VERSION_CODE wins
    def versionPropsFile = file('version.properties')
    def readBuildNumber = {
        if (!versionPropsFile.canRead()) throw new FileNotFoundException("Could not read version.properties!")
        versionPropsFile.withInputStream { versionProps.load(it) }
        versionProps['VERSION_BUILD'].toInteger()
    }
    def versionBuild = readBuildNumber()

    buildFeatures {
        dataBinding true
        mlModelBinding true
        // P214b: the app's own BuildConfig (version, package, git identity). AGP 8 no longer makes it by default; the
        // DNG Software tag used to read circleimageview's BuildConfig instead (VERSION_NAME "", VERSION_CODE -1).
        buildConfig true
    }

    // P662: the .bin assets (film/*.bin, canet/canetp_v4.bin) are read as streams (AssetManager.open / getInputStream; nothing
    // maps them through openFd), so they are compressed (-1.2 MB). NCNN (the reason for 'bin' / 'param') is gone; a .tflite
    // would be mapped by the ML model binding, so it stays stored.
    androidResources {
        noCompress += ['tflite']
        ignoreAssetsPatterns.add('film-reference')
        // UI languages: English (default values/) and Russian (values-ru/); library translations for others are dropped.
        localeFilters += ['en', 'ru']
    }

    packagingOptions {
        jniLibs {
            // Extracted to nativeLibraryDir: the SCAM/neural worker (buildScamNeuralWorker) and its QNN
            // runtime (added by tools/package_scam_neural.py) run from there, with or without root.
            useLegacyPackaging true
        }
    }

    ext.autoIncrementBuildNumber = {
        versionBuild = readBuildNumber() + 1
        versionProps['VERSION_BUILD'] = versionBuild.toString()
        versionPropsFile.withWriter { versionProps.store(it, null) }
    }

    // CI supplies SCAMERA_VERSION_CODE = 30000 + commit count; local builds keep
    // the auto-incremented value from version.properties.
    def ciVersionCode = (System.getenv('SCAMERA_VERSION_CODE') ?: versionBuild.toString()).toInteger()

    defaultConfig {
        compileSdk 36
        ndkVersion "27.2.12479018"
        // P275 (owner, 2026-10-19: «имя пакета делаем наше собственное»): the app's own package; the vivo native routes take
        // the SDK lease instead of the CTS package (-PscameraCtsNativeRaw=true still builds android.camera.cts for comparison)
        applicationId (providers.gradleProperty('scameraCtsNativeRaw').orNull == 'true'
                ? 'android.camera.cts' : 'com.scamera.app')
        // P183: the launcher shortcut targets whichever package this build is (CI builds the CTS one)
        resValue "string", "shortcut_target_package", applicationId
        minSdkVersion 26
        targetSdkVersion 35
        versionCode ciVersionCode
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        ndk {
            //noinspection ChromeOsAbiSupport
            // 64-bit only. Android has required 64-bit support since API 30 and
            // no device this runs on is 32-bit; the armeabi-v7a copies of ncnn,
            // tensorflow-lite, libarchive and dngCreator were 8.1 MB of the APK
            // and could never be loaded.
            abiFilters "arm64-v8a"
        }
        versionName '0.98'
        versionProps['VERSION_NAME'] = versionName
        // P214b: util/BuildIdentity.line() - "SCAMERA <versionName> (<versionCode>) <package> <sha>[+dirty] <CI|local>"
        buildConfigField 'String', 'GIT_SHA', "\"${scameraBuildIdentity.sha}\""
        buildConfigField 'boolean', 'GIT_DIRTY', "${scameraBuildIdentity.dirty}"
        buildConfigField 'boolean', 'CI_BUILD', "${scameraBuildIdentity.ci}"
        if (System.getenv('SCAMERA_LOCAL_CMAKE_VERSION')) {
            // Only when substituting a newer local CMake (CI uses the SDK's
            // pinned 3.22.1 and never sets this env var): CMake 4 removed
            // support for vendored deps that declare cmake_minimum_required
            // below 3.5 (e.g. the fetched rt_fftw sources).
            externalNativeBuild {
                cmake {
                    arguments "-DCMAKE_POLICY_VERSION_MINIMUM=3.5"
                }
            }
        }
    }

    gradle.taskGraph.whenReady { graph ->
        if (graph.hasTask(assembleDebug) || graph.hasTask(assembleRelease)) autoIncrementBuildNumber()
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            jniDebuggable = false
            zipAlignEnabled = true
            signingConfig signingConfigs.debug
        }
        debug {
            // This is the shipped variant (CI and local packaging use assembleDebug).
            // Not debuggable: ART compiles the app instead of interpreting it, and the
            // JNI libraries (RAW copy/convert, DNG writer) are built optimised - the
            // Debug CMake type built them at -O0.
            debuggable false
            // P662: shrunk by R8 without renaming (proguard-rules.pro: -dontobfuscate; the keeps for reflection, JNI, GSON, the su
            // launcher's main) and with unused resources removed (res/raw/keep.xml); unit tests still run on the javac classes.
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            jniDebuggable = false
            zipAlignEnabled = true
            externalNativeBuild {
                cmake {
                    arguments "-DCMAKE_BUILD_TYPE=Release"
                }
            }
        }
    }

    externalNativeBuild {
        cmake {
            version System.getenv('SCAMERA_LOCAL_CMAKE_VERSION') ?: "3.22.1"
            path "src/main/cpp/CMakeLists.txt"
        }
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }
    lint {
        abortOnError false
        // The shipped debug variant is not debuggable; skip lintVital on assemble.
        checkReleaseBuilds false
    }
    namespace 'com.scamera.app'
    applicationVariants.all {
        variant -> variant.outputs.all {
            outputFileName = "SCAMERA-${versionName}-${variant.versionCode}-${variant.name}.apk"
        }
        variant.assembleProvider.configure {
            doLast {
                variant.outputs.each { output -> verifyApkCode(output.outputFile) }
            }
        }
    }
    testOptions {
        unitTests.returnDefaultValues = true
        unitTests.includeAndroidResources = true
        unitTests.all {
            maxHeapSize = "2g"
            testLogging { exceptionFormat = "full" }
            jvmArgs '--add-opens=java.base/java.lang=ALL-UNNAMED', '--add-opens=java.base/java.util=ALL-UNNAMED',
                    '--add-opens=java.base/java.io=ALL-UNNAMED', '--add-opens=java.base/java.net=ALL-UNNAMED',
                    '--add-opens=java.base/java.security=ALL-UNNAMED', '--add-opens=java.base/java.text=ALL-UNNAMED',
                    '--add-opens=java.base/jdk.internal.access=ALL-UNNAMED', '--add-opens=java.desktop/java.awt.font=ALL-UNNAMED'
        }
    }
}
// This must be an executable launched with exec(), never a JNI shared object:
// app_process/System.load creates an ART namespace that excludes FastRPC deps.
// P662: it ships once, as lib/arm64-v8a/libscamera_worker.so (extracted to nativeLibraryDir: the app process and the su
// launcher both run that file; the copy in assets/scam-neural is gone, -1.7 MB), linked without its static symbol table
// (-s: 5.5 -> 3.6 MB; .dynsym stays, the crash handler's dladdr and the pc offsets are unchanged, the code is identical).
def neuralLibs = layout.buildDirectory.dir('generated/scamNeuralLibs')
def buildScamNeuralWorker = tasks.register('buildScamNeuralWorker', Exec) {
    inputs.files(fileTree('src/main/cpp') { include 'scam-neural-*', 'scam-*' })
    inputs.property('ndkVersion', '27.2.12479018')
    outputs.file(neuralLibs.map { it.file('arm64-v8a/libscamera_worker.so') })
    doFirst {
        def host = System.getProperty('os.name').toLowerCase()
        def tag = host.contains('mac') ? 'darwin-x86_64' : 'linux-x86_64'
        if (host.contains('windows')) throw new GradleException('Native worker build requires Linux or macOS')
        def clang = new File(android.sdkDirectory, "ndk/27.2.12479018/toolchains/llvm/prebuilt/${tag}/bin/aarch64-linux-android26-clang++")
        def output = neuralLibs.get().file('arm64-v8a/libscamera_worker.so').asFile
        output.parentFile.mkdirs()
        commandLine clang.absolutePath, '-std=c++17', '-O2', '-Wall', '-Wextra',
                '-pthread', '-fPIE', '-pie', '-static-libstdc++', '-Wl,-z,max-page-size=16384', '-s',
                file('src/main/cpp/scam-neural-worker.cpp').absolutePath, '-ldl', '-lEGL', '-lGLESv3', '-o', output.absolutePath
    }
}
android.sourceSets.main.jniLibs.srcDir(neuralLibs)

tasks.configureEach {
    if (name.startsWith('merge') && name.endsWith('JniLibFolders')) dependsOn(buildScamNeuralWorker)
}

dependencies {

    implementation fileTree(dir: 'libs', include: ['*.jar'])
    implementation project(path: ':circularbarlib')
    implementation 'androidx.appcompat:appcompat:1.7.1'
    implementation 'androidx.constraintlayout:constraintlayout:2.2.1'
    implementation 'androidx.preference:preference-ktx:1.2.1'
    implementation 'org.jetbrains:annotations:26.1.0'
    implementation 'androidx.exifinterface:exifinterface:1.4.2'
    // HEIC photo output (API 28+; the library's minSdk 28 is overridden in the manifest and every use is guarded)
    implementation 'androidx.heifwriter:heifwriter:1.1.0'
    implementation 'androidx.recyclerview:recyclerview:1.4.0'
    implementation 'com.github.mohammadatif:Animatoo:master'
    implementation 'com.github.bumptech.glide:glide:5.0.5'
    annotationProcessor 'com.github.bumptech.glide:compiler:5.0.5'
    implementation group: 'commons-io', name: 'commons-io', version: '20030203.000550'
    implementation 'com.google.code.gson:gson:2.13.2'
    // Navigation Component
    implementation "androidx.navigation:navigation-fragment-ktx:2.9.7"
    implementation "androidx.navigation:navigation-ui-ktx:2.9.7"
    //Subsampling image view
    implementation 'com.davemorrissey.labs:subsampling-scale-image-view-androidx:3.10.0'
    //Google Material
    implementation 'com.google.android.material:material:1.13.0'
    implementation "androidx.core:core-ktx:1.18.0"
    implementation "org.jetbrains.kotlin:kotlin-stdlib-jdk7:$kotlin_version"
    implementation "com.anggrayudi:storage:2.2.0"
    // P504 (owner, 2026-11-05: «Поиск должен искать текст на фото … копировать текст с фото на любом языке»): Tesseract 5 OCR
    // (Apache-2.0) with the tessdata_fast models in assets/tessdata
    implementation 'com.github.adaptech-cz.Tesseract4Android:tesseract4android-openmp:4.8.0'
    //implementation 'com.microsoft.onnxruntime:onnxruntime-android:latest.release'
    //Leak Canary
    //Use this lib to detect memory leaks when debugging
    //debugImplementation 'com.squareup.leakcanary:leakcanary-android:2.6'
    //For Testing
    testImplementation 'org.mockito:mockito-core:5.23.0'
    testImplementation 'org.junit.jupiter:junit-jupiter:6.0.3'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.robolectric:robolectric:4.17'
    // Robolectric delegates javax.* to the host loader; EGL context tests need these API classes there.
    testRuntimeOnly 'org.khronos:opengl-api:gl1.1-android-2.1_r1'
    androidTestImplementation 'org.testng:testng:7.12.0'
    androidTestImplementation 'androidx.test:runner:1.6.2'
    androidTestImplementation 'androidx.test:core:1.7.0'
    androidTestImplementation 'androidx.test.ext:junit:1.3.0'
}
repositories {
    mavenCentral()
}
