name: Build SCAMERA test APK

# Actions minutes and artifact storage are budgeted: builds run for main only (no PR or stale-branch duplicates, docs-only
# pushes skipped), a newer push cancels the running build, and the artifacts are kept for days, not the 90-day default.
# Independent checks and Android compilation overlap; only publish waits for every job to succeed.
on:
  push:
    branches: [ main ]
    paths-ignore: [ '**/*.md', 'docs/**', 'research/**' ]
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      version_code: ${{ steps.ver.outputs.code }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0        # Versioning uses the documented source baseline below.

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # The action installs the obsolete "tools" package by default; it no
      # longer exists in current cmdline-tools and sdkmanager exits 1 on it,
      # which started failing every build. Everything needed is installed in
      # the step below.
      - uses: android-actions/setup-android@v3
        with:
          packages: ''

      - name: Install NDK and CMake
        run: sdkmanager --install "ndk;27.2.12479018" "cmake;3.22.1" "platforms;android-36" "build-tools;36.0.0"

      - name: Check fast worker launcher and GCam diagnostic decoder
        run: |
          python3 tools/check_gcam61_makernote.py
          ndk_bin="$ANDROID_HOME/ndk/27.2.12479018/toolchains/llvm/prebuilt/linux-x86_64/bin"
          for target in aarch64-linux-android26 x86_64-linux-android26; do
            "$ndk_bin/clang++" --target="$target" -std=c++17 -fsyntax-only app/src/main/cpp/worker-spawn.cpp tools/check_worker_spawn.cpp
          done

      - uses: gradle/actions/setup-gradle@v4

      - name: Compute versionCode
        id: ver
        # Reserve versions delivered locally; increment from the last published source baseline.
        run: echo "code=$((31193 + $(git rev-list --count 5582cfbd52a33cb94055ff1c263ea91fb638baa8..HEAD)))" >> "$GITHUB_OUTPUT"

      - name: Check ZSL gyro exposure windows
        run: |
          mkdir -p /tmp/gyro-check
          javac -d /tmp/gyro-check app/src/main/java/com/scamera/app/control/GyroBurst.java app/src/main/java/com/scamera/app/control/GyroExposureWindow.java tools/java/GyroExposureWindowCheck.java
          java -cp /tmp/gyro-check GyroExposureWindowCheck

      - name: Check settings precision and algorithm availability
        run: |
          python3 tools/check_settings_model.py
          python3 tools/make_ui_icons.py --check
          python3 tools/icons/concept_icons.py --board HybridIcons --prefix cs_ --check
          python3 tools/icons/concept_icons.py --board Hybrid --table ICONS --tones HUES --prefix cs_ic_ --stroke 2.1 --check
          python3 tools/icons/concept_icons.py --board Modules --table D --prefix cs_mod_ --stroke 2.1 --check
          python3 tools/icons/concept_icons.py --inline --prefix cs_ --check
          python3 tools/icons/concept_icons_cam.py --board Viewfinder --prefix cv_ --check
          python3 tools/icons/concept_icons_cam.py --board ViewfinderLand --prefix cv_ --check

      - name: Check UI language (English defaults, Russian in values-ru, Java text through Lang)
        run: python3 tools/check_ui_language.py

      - name: Build debug APK and run unit tests
        env:
          SCAMERA_VERSION_CODE: ${{ steps.ver.outputs.code }}
        run: |
          chmod +x gradlew
          ./gradlew :app:testDebugUnitTest --tests "com.scamera.app.processing.color.FilmReferenceParametersTest" --tests "com.scamera.app.processing.color.FilmReferenceEngineTest" --tests "com.scamera.app.processing.color.FilmProfileMappingTest" --tests "com.scamera.app.processing.color.FilmPreviewLutTest" --tests "com.scamera.app.ui.settings.custompreferences.FilmSimPreviewTest" --tests "com.scamera.app.processing.opengl.postpipeline.FilmPreviewExposureTest" --tests "com.scamera.app.processing.opengl.postpipeline.ReferenceFilmTransferTest" --tests "com.scamera.app.manual.UnspektraAeTest" --tests "com.scamera.app.manual.UnspektraMeterTest" --tests "com.scamera.app.capture.UnspektraRawMeterTest" --tests "com.scamera.app.capture.UnspektraCameraAeTest" --tests "com.scamera.app.settings.UnspektraAePreferencesTest" --tests "com.scamera.app.processing.opengl.postpipeline.WhyResolveDenoiseTest" --tests "com.scamera.app.processing.opengl.postpipeline.ResolveMemoryPolicyTest" --tests "com.scamera.app.ui.style.UiFixedScaleTest" --tests "com.scamera.app.ui.style.ConceptFontTest" --tests "com.scamera.app.ui.settings.SettingsConceptShotsTest" --tests "com.scamera.app.util.AsyncLogTest" --tests "com.scamera.app.util.ParallelWorkOwnTest" --tests "com.scamera.app.processing.PedestalFloorTest" --tests "com.scamera.app.util.ScameraFilesTest" --tests "com.scamera.app.util.DcimMoveBackTest" --tests "com.scamera.app.settings.SettingsMenuTest" --tests "com.scamera.app.settings.SettingsMovesKeepValuesTest" --tests "com.scamera.app.ui.settings.ModuleProfilesPageTest" --tests "com.scamera.app.ui.settings.ScamLabFragmentTest" --tests "com.scamera.app.ui.settings.ScamLabSandboxTest" --tests "com.scamera.app.ui.settings.SettingHelpTest" --tests "com.scamera.app.ui.settings.PageResetTest" --tests "com.scamera.app.ui.settings.ModuleRowsTest" --tests "com.scamera.app.ui.settings.SettingsLayoutPageTest" --tests "com.scamera.app.settings.SettingsLayoutTest" --tests "com.scamera.app.settings.Settin